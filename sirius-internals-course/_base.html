  <link rel="stylesheet" href="styles.css">

  <style>
    :root {
      --color-accent:       #2A7B9B;
      --color-accent-hover: #1F6280;
      --color-accent-light: #E4F2F7;
      --color-accent-muted: #5A9DB8;
    }

    /* ── Responsive width overrides ─────────────────────────────
       The stock sheet caps content at 800px, which squeezes the
       code | Plain-English panels into ~350px columns. Make the
       content column fluid and let the panels breathe. */
    :root {
      --content-width:      min(1120px, 94vw);
      --content-width-wide: min(1280px, 96vw);
    }

    /* Code panel is denser than the English panel — give it more room,
       and use minmax(0,·) so pre-wrap can actually wrap inside the grid
       (default min-width:auto lets long tokens blow the column out). */
    .translation-block {
      grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr);
    }
    .translation-code, .translation-english { min-width: 0; }
    .translation-code pre,
    .translation-code code {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .translation-english { overflow-wrap: break-word; }

    /* Stack the panels while columns would still be cramped —
       the stock sheet only stacks below 768px, far too late. */
    @media (max-width: 1000px) {
      .translation-block { grid-template-columns: 1fr; }
      .translation-english { border-left: none; border-top: 3px solid var(--color-accent); }
    }

    /* Keep prose comfortably readable inside the wider column:
       cap paragraph measure without constraining diagrams/panels. */
    .screen > p, .module-content > p { max-width: 70ch; }

    /* ── Interactive repo tree (Module 2's ownership map) ─────── */
    .repo-tree {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 12px;
      padding: 14px 16px;
      font-family: var(--font-mono);
      font-size: var(--text-sm);
      line-height: 1.55;
    }
    .repo-tree details { margin: 0; }
    .repo-tree summary {
      cursor: pointer; list-style: none;
      display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px;
      padding: 4px 8px; border-radius: 6px; font-weight: 600;
    }
    .repo-tree summary::-webkit-details-marker { display: none; }
    .repo-tree summary::before {
      content: '\25B8'; /* ▸ */
      color: var(--color-text-muted); width: 1em; flex: none;
      transition: transform .15s ease; display: inline-block;
    }
    .repo-tree details[open] > summary::before { transform: rotate(90deg); }
    .repo-tree summary:hover, .repo-tree .rt-leaf:hover { background: var(--color-accent-light); }
    .repo-tree .rt-kids {
      margin-left: 11px; padding-left: 16px;
      border-left: 1px solid var(--color-border);
    }
    .repo-tree .rt-leaf {
      display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px;
      padding: 3px 8px; border-radius: 6px;
    }
    .repo-tree .rt-leaf::before { content: '\00B7'; color: var(--color-text-muted); width: 1em; flex: none; }
    .repo-tree a { color: var(--color-accent); text-decoration: none; }
    .repo-tree a:hover { text-decoration: underline; }
    .repo-tree .rt-role { font-family: var(--font-body); color: var(--color-text-secondary); }
    .repo-tree .rt-hint { font-family: var(--font-body); font-size: var(--text-xs); color: var(--color-text-muted); }

    /* ── Doc-comment reader mode (JetBrains-style) ──────────────
       Full-line comment runs inside code panels render as flowing
       prose instead of hard-wrapped ///-prefixed lines. */
    .code-doc {
      display: block;
      font-family: var(--font-body);
      font-size: 0.92em;
      font-style: italic;
      color: #A6ADC8;
      background: rgba(255,255,255,0.05);
      border-left: 2px solid rgba(203,166,247,0.45);
      border-radius: 0 6px 6px 0;
      padding: 8px 12px;
      margin: 6px 0;
      line-height: 1.55;
      white-space: normal;
    }
    .code-doc .doc-p { display: block; margin: 0 0 6px; }
    .code-doc .doc-p:last-child { margin-bottom: 0; }
    .code-doc .doc-tag {
      font-family: var(--font-mono);
      font-style: normal;
      font-size: 11px;
      color: #CBA6F7;
      border: 1px solid rgba(203,166,247,0.35);
      border-radius: 9999px;
      padding: 0 8px;
      margin-right: 6px;
      white-space: nowrap;
    }
    .code-doc code { font-style: normal; color: #CDD6F4; font-size: 0.95em; }
    .translation-label .rm-chip {
      font-style: normal;
      font-size: 10px;
      color: #CBA6F7;
      border: 1px solid rgba(203,166,247,0.35);
      border-radius: 9999px;
      padding: 0 7px;
      margin-left: 8px;
      vertical-align: middle;
    }
  </style>
