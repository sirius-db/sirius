name: Validate

on:
  pull_request_target:
    types: [opened, reopened, edited, synchronize]

jobs:
  semantic-pr:
    name: pr-title
    runs-on: ubuntu-slim
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
