# NOTICE - Actions permissions policy (Settings > Actions > General):
#   - "Allow sirius-db, and select non-sirius-db, actions and reusable workflows"
#     - Allow actions created by GitHub: YES (covers actions/*)
#     - Allow actions by Marketplace verified creators: NO
#     - Explicitly allowed third-party actions:
#       prefix-dev/setup-pixi@*
#       mozilla-actions/sccache-action@*
#       pre-commit/action@*
#     - Require actions to be pinned to a full-length commit SHA: NO
#
# Adding a new action? You must:
#   1. Pin it to a full-length commit SHA (e.g. uses: owner/repo@<40-char-sha> # vX.Y.Z)
#   2. If it is not from sirius-db, GitHub, or the explicitly allowed third-party actions above, add it to the
#      project-level allowlist above before merging
name: Check

on:
  push:
    branches:
      - dev
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive

      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

  build:
    env:
      SCCACHE_GHA_ENABLED: true
    strategy:
      matrix:
        arch: [x64, arm64]
        preset: [release, clang-debug]
        include:
          - arch: x64
            preset: release
            environment: vcpkg
      fail-fast: false
    runs-on: >-
      ${{ matrix.environment == 'vcpkg'
        && fromJSON('["self-hosted", "ubuntu-22.04", "cuda-13", "cpu-xl"]')
        || format('ubuntu-24.04{0}', case(matrix.arch == 'arm64', '-arm', '')) }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive

      - name: Unshallow vcpkg for version overrides
        if: matrix.environment == 'vcpkg'
        run: git -C vcpkg fetch --unshallow

      - uses: prefix-dev/setup-pixi@a0af7a228712d6121d37aba47adf55c1332c9c2e # v0.9.4
        with:
          cache: false
          pixi-version: v0.65.0
          environments: ${{ matrix.environment || 'default' }}

      - uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9

      - name: Export vcpkg cache variables
        if: matrix.environment == 'vcpkg'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Build
        run: pixi run -e ${{ matrix.environment || 'default' }} build ${{ matrix.preset }} 100
        env:
          VCPKG_BINARY_SOURCES: ${{ matrix.environment == 'vcpkg' && 'clear;x-gha,readwrite' || '' }}
