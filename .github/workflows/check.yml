# NOTICE - Actions permissions policy (Settings > Actions > General):
#   - "Allow sirius-db, and select non-sirius-db, actions and reusable workflows"
#     - Allow actions created by GitHub: YES (covers actions/*)
#     - Allow actions by Marketplace verified creators: NO
#     - Explicitly allowed third-party actions:
#       prefix-dev/setup-pixi@*
#       mozilla-actions/sccache-action@*
#     - Require actions to be pinned to a full-length commit SHA: NO
#
# Adding a new action? You must:
#   1. Pin it to a full-length commit SHA (e.g. uses: owner/repo@<40-char-sha> # vX.Y.Z)
#   2. If it is not from sirius-db, GitHub, or the explicitly allowed third-party actions above, add it to the
#      project-level allowlist above before merging
name: Check

on:
  push:
    branches:
      - dev
  pull_request:
  merge_group:

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive

      - uses: prefix-dev/setup-pixi@1b2de7f3351f171c8b4dfeb558c639cb58ed4ec0 # v0.9.5
        with:
          cache: false
          pixi-version: v0.65.0
          global-environments: |
            pre-commit

      - run: pre-commit run --show-diff-on-failure --all-files

  build:
    env:
      SCCACHE_GHA_ENABLED: true
    strategy:
      matrix:
        arch:
          - x64
          - arm64
        compiler:
          - gcc
          - clang
        build-type:
          - release
          - debug
        environment: [default]
        cudf-channel:
          - stable
        exclude:
          - compiler: gcc
            build-type: debug
          - compiler: clang
            build-type: release
        include:
          - arch: arm64
            compiler: gcc
            build-type: release
            environment: vcpkg
            cudf-channel: stable
          - arch: arm64
            compiler: gcc
            build-type: release
            environment: default
            cudf-channel: nightly
      fail-fast: false
    runs-on: >-
      ${{ matrix.environment == 'vcpkg--'
        && fromJSON('["self-hosted", "ubuntu-22.04", "cuda-13", "cpu-xl"]')
        || format('ubuntu-24.04{0}', case(matrix.arch == 'arm64', '-arm', '')) }}
    timeout-minutes: ${{ case(matrix.environment == 'vcpkg', 360, 60) }}
    continue-on-error: ${{ matrix.cudf-channel == 'nightly' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive

      - name: Unshallow vcpkg for version overrides
        if: matrix.environment == 'vcpkg'
        run: git -C vcpkg rev-parse --is-shallow-repository | grep -q true && git -C vcpkg fetch --unshallow || true

      - uses: prefix-dev/setup-pixi@1b2de7f3351f171c8b4dfeb558c639cb58ed4ec0 # v0.9.5
        with:
          cache: false
          pixi-version: v0.65.0
          activate-environment: ${{ matrix.environment != 'vcpkg' && matrix.cudf-channel != 'nightly' }}
          environments: >-
            ${{ matrix.cudf-channel == 'nightly' && 'nightly-runner'
              || matrix.environment }}

      - uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9

      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        if: matrix.environment == 'vcpkg'
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vcpkg.json', 'vcpkg/versions/baseline.json', 'vcpkg_ports/**') }}
          restore-keys: vcpkg-${{ runner.os }}-${{ runner.arch }}-

      - run: ${{ case(matrix.cudf-channel == 'nightly', 'pixi run -e nightly-runner nightly-run', '') }} make ${{ case(matrix.compiler == 'gcc', matrix.build-type, format('clang-{0}', matrix.build-type)) }} -j$(nproc)
        if: matrix.environment != 'vcpkg'
        env:
          CUDAARCHS: "100"

      - name: Build (vcpkg)
        if: matrix.environment == 'vcpkg'
        run: |
          pixi run -e vcpkg cmake -S duckdb --preset vcpkg-release
          pixi run -e vcpkg cmake --build build/vcpkg-release
