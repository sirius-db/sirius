# NOTICE - Actions permissions policy (Settings > Actions > General):
#   - "Allow sirius-db, and select non-sirius-db, actions and reusable workflows"
#     - Allow actions created by GitHub: YES (covers actions/*)
#     - Allow actions by Marketplace verified creators: NO
#     - Explicitly allowed third-party actions:
#       prefix-dev/setup-pixi@*
#       mozilla-actions/sccache-action@*
#     - Require actions to be pinned to a full-length commit SHA: NO
#
# Adding a new action? You must:
#   1. Pin it to a full-length commit SHA (e.g. uses: owner/repo@<40-char-sha> # vX.Y.Z)
#   2. If it is not from sirius-db, GitHub, or the explicitly allowed third-party actions above, add it to the
#      project-level allowlist above before merging
name: Check

on:
  push:
    branches:
      - dev
  pull_request:
  merge_group:

jobs:
  lint:
    runs-on: ubuntu-24.04
    env:
      # CPU runner: no GPU/driver, so pixi can't detect `__cuda` to match the
      # CUDA-pinned platform. Assert it so the (cuda13) environment resolves.
      CONDA_OVERRIDE_CUDA: "13"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive

      - uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0
        with:
          cache: false
          pixi-version: v0.71.1
          global-environments: |
            pre-commit

      - run: pre-commit run --show-diff-on-failure --all-files

  build:
    env:
      CARGO_INCREMENTAL: "0"
      RUSTC_WRAPPER: sccache
      # CPU build runners have no GPU/driver; assert `__cuda` so the CUDA-pinned
      # platform resolves. All environments built here (default, vcpkg,
      # nightly-runner) target CUDA 13.
      CONDA_OVERRIDE_CUDA: "13"
    strategy:
      matrix:
        build:
          - arch: x64
            compiler: gcc
            build-type: release
            environment: default
            cudf-channel: stable
            run-on-pr: true
          - arch: x64
            compiler: clang
            build-type: debug
            environment: default
            cudf-channel: stable
            run-on-pr: true
          - arch: arm64
            compiler: gcc
            build-type: release
            environment: default
            cudf-channel: stable
            run-on-pr: false
          - arch: arm64
            compiler: clang
            build-type: debug
            environment: default
            cudf-channel: stable
            run-on-pr: false
          - arch: x64
            compiler: gcc
            build-type: release
            environment: vcpkg
            cudf-channel: stable
            run-on-pr: false
          - arch: arm64
            compiler: gcc
            build-type: release
            environment: default
            cudf-channel: nightly
            run-on-pr: false
        exclude:
          # On PRs, drop rows marked merge/dev-only; on merge_group/dev, match nothing.
          - build:
              run-on-pr: ${{ fromJSON(github.event_name == 'pull_request' && 'false' || 'null') }}
      fail-fast: false
    name: build (${{ matrix.build.arch }}, ${{ matrix.build.compiler }}, ${{ matrix.build.build-type }}, ${{ matrix.build.environment }}, ${{ matrix.build.cudf-channel }})
    runs-on: >-
      ${{ matrix.build.environment == 'vcpkg'
        && fromJSON('["self-hosted", "ubuntu-24.04", "cpu-xl"]')
        || matrix.build.arch == 'x64'
        && fromJSON('["self-hosted", "ubuntu-24.04", "cpu-lg"]')
        || matrix.build.arch == 'arm64'
        && fromJSON('["self-hosted", "ubuntu-24.04", "arm-lg"]') }}
    timeout-minutes: ${{ case(matrix.build.environment == 'vcpkg', 240, 60) }}
    continue-on-error: ${{ matrix.build.cudf-channel == 'nightly' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive

      - name: Unshallow vcpkg for version overrides
        if: matrix.build.environment == 'vcpkg'
        run: git -C vcpkg rev-parse --is-shallow-repository | grep -q true && git -C vcpkg fetch --unshallow || true

      - uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0
        with:
          cache: false
          pixi-version: v0.71.1
          activate-environment: ${{ matrix.build.environment != 'vcpkg' && matrix.build.cudf-channel != 'nightly' }}
          environments: >-
            ${{ matrix.build.cudf-channel == 'nightly' && 'nightly-runner'
              || matrix.build.environment }}

      - name: Configure cache backends
        run: |
          if [[ -n "${SCCACHE_BUCKET}" ]]; then
            echo "SCCACHE_BUCKET DEFINED -> Self Hosted Runner, Disable GHA sccache, use S3 vcpkg cache"
            echo "SCCACHE_GHA_ENABLED=false" >> $GITHUB_ENV
          else
            echo "SCCACHE_BUCKET UNDEFINED -> GitHub Runner, Enable GHA sccache"
            echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV
          fi
          if [[ -n "${VCPKG_BUCKET}" ]]; then
            echo "VCPKG_BINARY_SOURCES=clear;x-aws,s3://${VCPKG_BUCKET}/,readwrite" >> $GITHUB_ENV
          fi

      - uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10

      - run: ${{ case(matrix.build.cudf-channel == 'nightly', 'pixi run -e nightly-runner nightly-run', '') }} make ${{ case(matrix.build.compiler == 'gcc', matrix.build.build-type, format('clang-{0}', matrix.build.build-type)) }} -j$(nproc)
        if: matrix.build.environment != 'vcpkg'
        env:
          CUDAARCHS: "100"

      # Rust bindings (sirius-sys + sirius) — fmt/clippy + build/link the test.
      # Run on a single representative entry. `cargo test --no-run` compiles the
      # cxx glue against the Sirius FFI header and links the proof-of-life test
      # against the single Sirius library built above (build.rs discovers it under
      # build/release). It is NOT run here: constructing a context does GPU
      # bring-up, and these are CPU runners — the actual run belongs on a GPU
      # runner (test workflow).
      - name: Rust bindings checks
        if: >-
          matrix.build.arch == 'x64' && matrix.build.compiler == 'gcc'
          && matrix.build.build-type == 'release' && matrix.build.environment == 'default'
          && matrix.build.cudf-channel == 'stable'
        run: |
          set -euo pipefail
          pixi run cargo fmt --manifest-path rust/Cargo.toml --package sirius --package sirius-sys --check
          pixi run cargo clippy --manifest-path rust/Cargo.toml --package sirius --package sirius-sys --all-targets -- -D warnings
          pixi run cargo test --no-run --manifest-path rust/Cargo.toml --package sirius --package sirius-sys

      - name: Build (vcpkg)
        if: matrix.build.environment == 'vcpkg'
        run: |
          set -o pipefail
          pixi run -e vcpkg cmake -S duckdb --preset vcpkg-release 2>&1 | tee /tmp/vcpkg.log
          pixi run -e vcpkg cmake --build build/vcpkg-release --target duckdb duckdb_local_extension_repo sirius_unittest 2>&1 | tee -a /tmp/vcpkg.log

      - name: vcpkg cache summary
        if: matrix.build.environment == 'vcpkg' && always()
        run: |
          [ -f /tmp/vcpkg.log ] || exit 0
          RESTORED=$(grep -oP 'Restored \K\d+(?= package)' /tmp/vcpkg.log | head -1)
          RESTORED=${RESTORED:-0}
          RESTORE_TIME=$(grep -oP 'from AWS in \K[\d.]+(?= min)' /tmp/vcpkg.log | head -1)
          TOTAL=$(grep -oP 'Installing \d+/\K\d+' /tmp/vcpkg.log | tail -1)
          BUILT=$((${TOTAL:-0} - ${RESTORED:-0}))
          UPLOADED=$(grep -c 'Starting submission' /tmp/vcpkg.log || true)
          BUILD_MS=$(grep -oP 'Elapsed time to handle [^:]+: \K[\d.]+(?= ms)' /tmp/vcpkg.log | awk '{s+=$1} END {printf "%.1f", s/1000}')
          HIT_RATE=$(( TOTAL > 0 ? RESTORED * 100 / TOTAL : 0 ))
          {
            echo "## vcpkg cache stats"
            echo "| Metric | Value |"
            echo "|---|---|"
            echo "| Cache hit % | **${HIT_RATE}%** |"
            echo "| Restored from S3 | **${RESTORED}** packages${RESTORE_TIME:+ in ${RESTORE_TIME} min} |"
            echo "| Built from source | **${BUILT}** packages |"
            echo "| Uploaded to S3 | **${UPLOADED}** packages |"
            [ "${BUILT}" -gt 0 ] && echo "| Build time | **${BUILD_MS}** s |" || true
          } >> "$GITHUB_STEP_SUMMARY"

  check:
    runs-on: ubuntu-slim
    needs: [lint, build]
    if: always()
    steps:
      - name: All checks ok
        if: ${{ needs.lint.result == 'success' && needs.build.result == 'success' }}
        run: exit 0
      - name: Some checks failed
        if: ${{ !(needs.lint.result == 'success' && needs.build.result == 'success') }}
        run: exit 1
