# NOTICE - Actions permissions policy (Settings > Actions > General):
#   - "Allow sirius-db, and select non-sirius-db, actions and reusable workflows"
#     - Allow actions created by GitHub: YES (covers actions/*)
#     - Allow actions by Marketplace verified creators: NO
#     - Explicitly allowed third-party actions:
#       prefix-dev/setup-pixi@*
#       mozilla-actions/sccache-action@*
#     - Require actions to be pinned to a full-length commit SHA: NO
#
# Adding a new action? You must:
#   1. Pin it to a full-length commit SHA (e.g. uses: owner/repo@<40-char-sha> # vX.Y.Z)
#   2. If it is not from sirius-db, GitHub, or the explicitly allowed third-party actions above, add it to the
#      project-level allowlist above before merging
name: Experimental

on:
  pull_request:
    paths:
      - 'experimental/**'
      - '.github/workflows/experimental.yml'
  merge_group:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  starrocks:
    name: starrocks
    runs-on: ubuntu-24.04
    env:
      # CPU runner: no GPU/driver. The workspace platforms are CUDA-pinned (the
      # `engine` feature targets CUDA 13), so assert `__cuda` for the `cn` env to
      # resolve even though `cn` itself is CUDA-agnostic.
      CONDA_OVERRIDE_CUDA: "13"
    defaults:
      run:
        working-directory: experimental/starrocks
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false

      - name: Init starrocks submodules
        working-directory: ${{ github.workspace }}
        run: git submodule update --init --depth=1 --jobs 2 experimental/starrocks/starrocks experimental/starrocks/brpc

      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          cache: false
          pixi-version: v0.71.1
          manifest-path: experimental/starrocks/pixi.toml
          environments: cn

      # Scope by package: `--all` would also reach the sibling rust/ workspace via the
      # `sirius` path dep. Mirrors check.yml's scoped rust/ fmt check.
      - name: fmt
        run: pixi run -e cn cargo fmt --package sirius-starrocks-cn --package starrocks-plan-translator --package starrocks-thrift -- --check

      # The CN's `sirius-engine` feature is on by default but links a Sirius build
      # tree (C++ toolchain + RAPIDS/CUDA) that this CI env does not have, so build
      # the pure-Rust path here. The engine path is exercised on a GPU box via
      # `pixi run cn-build` / `cn-test`.
      - name: clippy
        run: pixi run -e cn cargo clippy --all-targets --no-default-features -- -D warnings

      - name: test
        run: pixi run -e cn cargo test --workspace --no-default-features

  doris:
    name: doris
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # CPU runner: no GPU/driver. The workspace platforms are CUDA-pinned (the
      # `engine` feature targets CUDA 13), so assert `__cuda` for the `be` env to
      # resolve even though `be` itself is CUDA-agnostic.
      CONDA_OVERRIDE_CUDA: "13"
    defaults:
      run:
        working-directory: experimental/doris
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false

      # Only the Doris thrift/proto IDL is needed (the FE is an official binary, never built).
      - name: Init doris submodule
        working-directory: ${{ github.workspace }}
        run: git submodule update --init --depth=1 experimental/doris/doris

      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          cache: false
          pixi-version: v0.71.1
          manifest-path: experimental/doris/pixi.toml
          environments: be

      # Scope by package: `--all` would also reach the sibling rust/ workspace via the
      # `sirius` path dep.
      - name: fmt
        run: pixi run -e be cargo fmt --package sirius-doris-be --package doris-plan-translator --package doris-thrift --package doris-proto -- --check

      # The BE's `sirius-engine` feature is on by default but links a Sirius build tree
      # (C++ toolchain + RAPIDS/CUDA) that this CI env does not have, so build the
      # pure-Rust path here. The engine path is exercised on a GPU box via
      # `pixi run be-build` / `be-test`.
      - name: clippy
        run: pixi run -e be cargo clippy --all-targets --no-default-features -- -D warnings

      # Includes tests/corpus.rs, which replays the captured TPC-H dispatch fixtures.
      - name: test
        run: pixi run -e be cargo test --workspace --no-default-features

  doris-cpu-diff:
    name: doris-cpu-diff
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CONDA_OVERRIDE_CUDA: "13"
    defaults:
      run:
        working-directory: experimental/doris
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false

      - name: Init translator and DuckDB Substrait sources
        working-directory: ${{ github.workspace }}
        run: git submodule update --init --depth=1 experimental/doris/doris substrait

      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          cache: true
          pixi-version: v0.71.1
          manifest-path: experimental/doris/pixi.toml
          environments: check

      - name: Generate SF0.1 parquet and expected rows
        run: |
          pixi run -e check python scripts/generate-cpu-diff-data.py --out /tmp/doris-tpch-sf01
          pixi run -e check python scripts/validate_tpch_results.py expected --data /tmp/doris-tpch-sf01 --out /tmp/doris-expected-tpch
          pixi run -e check python scripts/validate_tpch_results.py expected --data /tmp/doris-tpch-sf01 --sql-dir sql/gaps --queries g13-distinct,g13-distinct-topn,null-not-in,null-left-join,null-not-exists --out /tmp/doris-expected-gaps

      - name: Build DuckDB Substrait consumer
        run: pixi run -e check duckdb-substrait-build

      - name: Compare all translated queries with DuckDB results
        run: |
          bash scripts/cpu-diff.sh --data /tmp/doris-tpch-sf01 --expected /tmp/doris-expected-tpch
          bash scripts/cpu-diff.sh --data /tmp/doris-tpch-sf01 --corpus tests/fixtures/gaps --sql-dir sql/gaps --expected /tmp/doris-expected-gaps --queries g13-distinct,g13-distinct-topn,null-not-in,null-left-join,null-not-exists --out log/cpu-diff-gaps

  experimental:
    name: experimental
    runs-on: ubuntu-slim
    needs: [starrocks, doris]
    if: always()
    steps:
      - name: All checks ok
        if: ${{ needs.starrocks.result == 'success' && needs.doris.result == 'success' }}
        run: exit 0
      - name: Some checks failed
        if: ${{ needs.starrocks.result != 'success' || needs.doris.result != 'success' }}
        run: exit 1
