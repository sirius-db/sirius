name: V2 Cache Benchmark
on:
  workflow_dispatch:

jobs:
  cache-warm:
    runs-on: [self-hosted, ubuntu-24.04, cpu-xl, pixi]
    env:
      SCCACHE_GHA_ENABLED: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
      - name: Record start
        run: echo "START=$(date +%s)" >> $GITHUB_ENV
      - uses: prefix-dev/setup-pixi@5185adfbffb4bd703da3010310260805d89ebb11 # v0.9.6
        with:
          cache: false
          pixi-version: v0.69.0
          activate-environment: default
      - name: Pixi install duration
        run: |
          echo "setup-pixi warm: $(($(date +%s) - START))s"
      - uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
      - name: Build
        env:
          CUDAARCHS: "89"
        run: make -j$(nproc)
      - name: Total duration
        run: |
          echo "Total warm: $(($(date +%s) - START))s"

  cache-cold:
    runs-on: [self-hosted, ubuntu-24.04, cpu-xl, pixi]
    env:
      SCCACHE_GHA_ENABLED: true
    steps:
      - name: Clear pre-seeded pixi cache
        run: rm -rf ~/.pixi/cache/
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
      - name: Record start
        run: echo "START=$(date +%s)" >> $GITHUB_ENV
      - uses: prefix-dev/setup-pixi@5185adfbffb4bd703da3010310260805d89ebb11 # v0.9.6
        with:
          cache: false
          pixi-version: v0.69.0
          activate-environment: default
      - name: Pixi install duration
        run: |
          echo "setup-pixi cold: $(($(date +%s) - START))s"
      - uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
      - name: Build
        env:
          CUDAARCHS: "89"
        run: make -j$(nproc)
      - name: Total duration
        run: |
          echo "Total cold: $(($(date +%s) - START))s"
