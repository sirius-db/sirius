# NOTICE - Actions permissions policy (Settings > Actions > General):
#   - "Allow sirius-db, and select non-sirius-db, actions and reusable workflows"
#     - Allow actions created by GitHub: YES (covers actions/*)
#     - Allow actions by Marketplace verified creators: NO
#     - Explicitly allowed third-party actions:
#       prefix-dev/setup-pixi@*
#       mozilla-actions/sccache-action@*
#     - Require actions to be pinned to a full-length commit SHA: NO
#
# Adding a new action? You must:
#   1. Pin it to a full-length commit SHA (e.g. uses: owner/repo@<40-char-sha> # vX.Y.Z)
#   2. If it is not from sirius-db, GitHub, or the explicitly allowed third-party actions above, add it to the
#      project-level allowlist above before merging
name: Test

on:
  push:
    branches:
      - dev
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }} # cancel existing runs on PRs but run on all `dev` and merge queue commits

jobs:
  build:
    env:
      SCCACHE_GHA_ENABLED: true
      CARGO_INCREMENTAL: "0"
      RUSTC_WRAPPER: sccache
      # CPU build runners have no GPU/driver; assert `__cuda` for the matrix's
      # CUDA version so its platform resolves. (The GPU test-run job below
      # detects the real driver.)
      CONDA_OVERRIDE_CUDA: ${{ matrix.cuda.version }}
    strategy:
      matrix:
        cuda:
          - version: "13"
            pixi-environment: default
            runner: ubuntu-24.04
            run-on-pr: true
          - version: "12"
            pixi-environment: cuda12
            runner: ubuntu-22.04
            run-on-pr: false
        exclude:
          # On PRs, drop CUDA variants marked merge/dev-only; on merge_group/dev, match nothing.
          - cuda:
              run-on-pr: ${{ case(github.event_name == 'pull_request', false, 'no-match') }}
      fail-fast: false
    runs-on: ${{ fromJSON(format('["self-hosted", "{0}", "cpu-xl"]', matrix.cuda.runner)) }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Init build submodules
        run: ./scripts/init_build_submodules.sh

      - uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          cache: false
          pixi-version: v0.71.1
          environments: ${{ matrix.cuda.pixi-environment }}
          activate-environment: ${{ matrix.cuda.pixi-environment }}

      - name: Configure sccache backend
        run: |
          if [[ -n "${SCCACHE_BUCKET}" ]]; then
            echo "SCCACHE_BUCKET DEFINED -> Self Hosted Runner, Disable GHA sccache"
            echo "SCCACHE_GHA_ENABLED=false" >> $GITHUB_ENV
          else
            echo "SCCACHE_BUCKET UNDEFINED -> GitHub Runner, Enable GHA sccache"
            echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV
          fi
          # Use 'sirius' prefix for sccache cache
          echo "SCCACHE_S3_KEY_PREFIX=sirius" >> $GITHUB_ENV

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Build
        env:
          CUDAARCHS: "75" # 75 for T4 capability; 89 for L4 capability
        run: |
          set -o pipefail
          make -j$(nproc) 2>&1 | tee /tmp/build.log

      - name: Surface build errors
        if: failure()
        run: |
          echo '## Build errors' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E '(FAILED:|: error:|: fatal error:)' /tmp/build.log | head -60 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Package build artifacts
        run: tar -cf build.tar build/release/

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-cuda-${{ matrix.cuda.version }}
          path: build.tar
          if-no-files-found: error
          retention-days: 1

  test-run:
    needs: build
    strategy:
      matrix:
        cuda:
          - version: "13"
            pixi-environment: default
            runner: ubuntu-24.04
            run-on-pr: true
          - version: "12"
            pixi-environment: cuda12
            runner: ubuntu-22.04
            run-on-pr: false
        exclude:
          # On PRs, drop CUDA variants marked merge/dev-only; on merge_group/dev, match nothing.
          - cuda:
              run-on-pr: ${{ case(github.event_name == 'pull_request', false, 'no-match') }}
      fail-fast: false
    runs-on: ${{ fromJSON(format('["self-hosted", "{0}", "gpu-2xt4"]', matrix.cuda.runner)) }}
    timeout-minutes: 60
    env:
      CUDA_CACHE_PATH: /home/runner/actions-runner/_work/.cuda-cache
      SIRIUS_LOG_LEVEL: trace
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          cache: false
          pixi-version: v0.71.1
          environments: ${{ matrix.cuda.pixi-environment }}
          activate-environment: ${{ matrix.cuda.pixi-environment }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-cuda-${{ matrix.cuda.version }}

      - name: Extract build artifacts
        run: tar -xf build.tar

      - name: Provision DuckDB extensions the tests load
        # The iceberg cases LOAD without INSTALL on purpose: a test must not reach the network,
        # and an INSTALL inside the test would silently paper over an unprovisioned runner
        # instead of failing with the install command. So provisioning happens here, out of
        # band. avro comes in as an iceberg dependency but is named explicitly so a failure
        # says which extension is missing.
        #
        # This resolves only because the build carries a real DuckDB version — see
        # scripts/init_build_submodules.sh. Against a v0.0.1 build there is no extension
        # repository to install from.
        run: ./build/release/duckdb -c "INSTALL avro; INSTALL iceberg;"

      - name: Run C++ unit tests
        run: |
          set -o pipefail
          nvidia-smi
          timeout 45m ./build/release/extension/sirius/test/cpp/sirius_unittest --abort 2>&1 | tee /tmp/unittest.log

      - name: Surface test failures
        if: failure()
        run: |
          echo '## Test failures' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -B 5 -A 10 'FAILED:' /tmp/unittest.log | head -80 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload unit test logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unittest-logs-cuda${{ matrix.cuda.version }}-${{ github.run_id }}
          path: build/release/extension/sirius/test/cpp/log/
          if-no-files-found: ignore
          retention-days: 14

      - name: Prepare SQL test datasets
        run: |
          ./setup_test_datasets.sh
          chmod -R a+r test_datasets/
          mkdir -p test_datasets/tpch_parquet_sf1
          ./build/release/duckdb -f scripts/tpch_to_parquet.sql

      - name: TPC-H performance snapshot
        id: tpch
        env:
          SIRIUS_CONFIG_FILE: ${{ github.workspace }}/test/cpp/integration/integration.yaml
          PARQUET_DIR: ${{ github.workspace }}/test_datasets/tpch_parquet_sf1
        run: |
          ./test/tpch_performance/benchmark_and_validate.sh 1
          RUN_DIR=$(ls -td runs/*/ | head -1)
          echo "run_dir=$RUN_DIR" >> "$GITHUB_OUTPUT"
          {
            echo "## TPC-H Performance (SF1)"
            echo '```'
            cat "$RUN_DIR/comparison.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          ERRORS=$(tail -n +2 "$RUN_DIR/validation.csv" | grep -cE ',error$' || true)
          if [ "$ERRORS" -gt 0 ]; then
            echo "::error::TPC-H snapshot: $ERRORS queries errored"
            if [ "${{ github.event_name }}" = "merge_group" ]; then
              exit 1
            fi
          fi

      - name: Upload TPC-H run artifacts
        if: always() && steps.tpch.outputs.run_dir != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tpch-run-${{ github.run_id }}-cuda-${{ matrix.cuda.version }}
          path: ${{ steps.tpch.outputs.run_dir }}
          retention-days: 14

  test:
    runs-on: ubuntu-slim
    needs: test-run
    if: always()
    steps:
      - name: Test workflow ok
        if: ${{ needs['test-run'].result == 'success' }}
        run: exit 0
      - name: Test workflow failed
        if: ${{ needs['test-run'].result != 'success' }}
        run: exit 1
