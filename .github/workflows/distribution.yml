# NOTICE - Actions permissions policy (Settings > Actions > General):
#   - "Allow sirius-db, and select non-sirius-db, actions and reusable workflows"
#     - Allow actions created by GitHub: YES (covers actions/*)
#     - Allow actions by Marketplace verified creators: NO
#     - Explicitly allowed third-party actions:
#       prefix-dev/setup-pixi@*
#       mozilla-actions/sccache-action@*
#     - Require actions to be pinned to a full-length commit SHA: NO
#
# Adding a new action? You must:
#   1. Pin it to a full-length commit SHA (e.g. uses: owner/repo@<40-char-sha> # vX.Y.Z)
#   2. If it is not from sirius-db, GitHub, or the explicitly allowed third-party actions above, add it to the
#      project-level allowlist above before merging
name: Distribution

on:
  push:
    branches:
      - main
  merge_group:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

env:
  duckdb_version: v1.5.6

jobs:
  build:
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        cuda-version: ["12", "13"]
        include:
          - arch: amd64
            runner: cpu-xl
          - arch: arm64
            runner: arm-xl
          - cuda-version: "12"
            environment: vcpkg-cuda12
          - cuda-version: "13"
            environment: vcpkg
    runs-on: [self-hosted, ubuntu-24.04, "${{ matrix.runner }}"]
    timeout-minutes: 240
    env:
      CONDA_OVERRIDE_CUDA: ${{ matrix.cuda-version }}
      CMAKE_BUILD_PARALLEL_LEVEL: "16"
      CARGO_INCREMENTAL: "0"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize build dependencies
        run: |
          git submodule update --init --depth=1 --jobs 2 sirius-duckdb/duckdb sirius-duckdb/extension-ci-tools
          git submodule update --init vcpkg
          if [[ "$(git -C vcpkg rev-parse --is-shallow-repository)" == "true" ]]; then
            git -C vcpkg fetch --unshallow
          fi

      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.81.0
          environments: ${{ matrix.environment }}
          cache: false

      - name: Configure cache backends
        run: |
          if [[ -n "${SCCACHE_BUCKET}" ]]; then
            echo "SCCACHE_GHA_ENABLED=false" >> "$GITHUB_ENV"
          else
            echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          fi
          echo "SCCACHE_S3_KEY_PREFIX=sirius" >> "$GITHUB_ENV"
          if [[ -n "${VCPKG_BUCKET}" ]]; then
            echo "VCPKG_BINARY_SOURCES=clear;x-aws,s3://${VCPKG_BUCKET}/sirius/,readwrite" >> "$GITHUB_ENV"
          fi

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.18.0

      - name: Select the Sirius source revision
        env:
          SIRIUS_SOURCE_URL: https://github.com/${{ github.repository }}.git
          SIRIUS_SOURCE_REF: ${{ github.sha }}
        run: |
          sed -i -E \
            -e "s|^set\(sirius_url .*\)$|set(sirius_url $SIRIUS_SOURCE_URL)|" \
            -e "s|^set\(sirius_ref .*\)$|set(sirius_ref $SIRIUS_SOURCE_REF)|" \
            sirius-duckdb/vcpkg_ports/sirius/portfile.cmake

      - name: Build the bundled extension
        run: |
          pixi run --locked -e "${{ matrix.environment }}" bash -euo pipefail -c '
            make -C sirius-duckdb release \
              SIRIUS_DUCKDB_LINKAGE=static \
              VCPKG_TOOLCHAIN_PATH="$PWD/vcpkg/scripts/buildsystems/vcpkg.cmake" \
              DUCKDB_PLATFORM=linux_${{ matrix.arch }} \
              EXT_FLAGS="-DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache"
          '

      - name: Check release asset size
        run: |
          artifact=sirius-duckdb/build/release/extension/sirius/sirius.duckdb_extension
          bytes=$(stat -c %s "$artifact")
          echo "Extension size: $bytes bytes"
          [[ "$bytes" -lt 2147483648 ]]

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sirius-${{ env.duckdb_version }}-extension-linux_${{ matrix.arch }}-cuda${{ matrix.cuda-version }}
          path: sirius-duckdb/build/release/extension/sirius/sirius.duckdb_extension
          if-no-files-found: error

      - name: Package the GPU test build
        if: matrix.arch == 'amd64' && matrix.cuda-version == '13'
        run: |
          mkdir -p build
          tar -C sirius-duckdb -cf build/extension-test.tar \
            build/release/test/unittest \
            build/release/extension/sirius/sirius.duckdb_extension

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.arch == 'amd64' && matrix.cuda-version == '13'
        with:
          name: sirius-extension-test-build
          path: build/extension-test.tar
          if-no-files-found: error
          retention-days: 1

  test:
    needs: build
    runs-on: [self-hosted, ubuntu-24.04, gpu-2xt4]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.81.0
          manifest-path: sirius-duckdb/pixi.toml
          cache: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sirius-extension-test-build
          path: build

      - name: Test the bundled extension on GPU
        env:
          SIRIUS_CONFIG_FILE: ${{ github.workspace }}/sirius-duckdb/test/config.yaml
        run: |
          tar -C sirius-duckdb -xf build/extension-test.tar
          pixi run --manifest-path sirius-duckdb/pixi.toml --locked bash -euo pipefail -c '
            export LD_LIBRARY_PATH="$CONDA_PREFIX/lib:${LD_LIBRARY_PATH:-}"
            cd sirius-duckdb
            ./build/release/test/unittest --test-dir "$PWD" "test/*"
          '

  distribution:
    runs-on: ubuntu-slim
    needs: [build, test]
    if: always()
    steps:
      - name: Check
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == pull_request && "$BUILD_RESULT" == skipped && "$TEST_RESULT" == skipped ]]; then
            exit 0
          fi
          [[ "$BUILD_RESULT" == success && "$TEST_RESULT" == success ]]
