# NOTICE - Actions permissions policy (Settings > Actions > General):
#   - "Allow sirius-db, and select non-sirius-db, actions and reusable workflows"
#     - Allow actions created by GitHub: YES (covers actions/*)
#     - Allow actions by Marketplace verified creators: NO
#     - Explicitly allowed third-party actions:
#       prefix-dev/setup-pixi@*
#       mozilla-actions/sccache-action@*
#     - Require actions to be pinned to a full-length commit SHA: NO
#
# Adding a new action? You must:
#   1. Pin it to a full-length commit SHA (e.g. uses: owner/repo@<40-char-sha> # vX.Y.Z)
#   2. If it is not from sirius-db, GitHub, or the explicitly allowed third-party actions above, add it to the
#      project-level allowlist above before merging
name: Distribution

on:
  push:
    branches:
      - main
  merge_group:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  cuda-13:
    if: github.event_name != 'pull_request'
    uses: sirius-db/extension-ci-tools/.github/workflows/_extension_distribution.yml@sirius
    with:
      extension_name: sirius
      duckdb_version: 88ecd0a49d7d3d838e002b2fbc0ce91ccf74110e
      ci_tools_version: sirius
      extension_directory: sirius-duckdb
      exclude_archs: "linux_amd64_musl;linux_arm64_musl;osx_amd64;osx_arm64;windows_amd64;windows_arm64;windows_amd64_mingw;wasm_mvp;wasm_eh;wasm_threads"
      extra_toolchains: "cuda;rust;libclang;lld"
      vcpkg_url: "https://github.com/microsoft/vcpkg.git"
      vcpkg_commit: "cd61e1e26a038e82d6550a3ebbe0fbbfe7da78e3"
      vcpkg_binary_cache_enabled: true
      skip_tests: true
      save_cache: ${{ github.ref == 'refs/heads/main' }}
      reduced_ci_mode: "disabled"
      override_ci_tools_repository: "sirius-db/extension-ci-tools"
      build_duckdb_shell: false
      vcpkg_overlay_ports: "sirius-duckdb/vcpkg_ports"
      vcpkg_overlay_triplets: "sirius-duckdb/vcpkg_triplets"
      cuda_archs: "75-real;80-real;86-real;89-real;90a-real;100f-real;120a-real;120"
      cuda_version: "13"
      artifact_postfix: "-cuda13"
      runners: '{"linux_x64": ["self-hosted", "ubuntu-24.04", "cpu-xl"], "linux_arm64": ["self-hosted", "ubuntu-24.04", "arm-xl"]}'

  cuda-12:
    if: github.event_name != 'pull_request'
    uses: sirius-db/extension-ci-tools/.github/workflows/_extension_distribution.yml@sirius
    with:
      extension_name: sirius
      duckdb_version: 88ecd0a49d7d3d838e002b2fbc0ce91ccf74110e
      ci_tools_version: sirius
      extension_directory: sirius-duckdb
      exclude_archs: "linux_amd64_musl;linux_arm64_musl;osx_amd64;osx_arm64;windows_amd64;windows_arm64;windows_amd64_mingw;wasm_mvp;wasm_eh;wasm_threads"
      extra_toolchains: "cuda;rust;libclang;lld"
      vcpkg_url: "https://github.com/microsoft/vcpkg.git"
      vcpkg_commit: "cd61e1e26a038e82d6550a3ebbe0fbbfe7da78e3"
      vcpkg_binary_cache_enabled: true
      skip_tests: true
      save_cache: ${{ github.ref == 'refs/heads/main' }}
      reduced_ci_mode: "disabled"
      override_ci_tools_repository: "sirius-db/extension-ci-tools"
      build_duckdb_shell: false
      vcpkg_overlay_ports: "sirius-duckdb/vcpkg_ports"
      vcpkg_overlay_triplets: "sirius-duckdb/vcpkg_triplets"
      cuda_archs: "75-real;80-real;86-real;89-real;90a-real;100-real;120-real"
      cuda_version: "12"
      artifact_postfix: "-cuda12"
      runners: '{"linux_x64": ["self-hosted", "ubuntu-22.04", "cpu-xl"], "linux_arm64": ["self-hosted", "ubuntu-22.04", "arm-xl"]}'

  validation-host:
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: git submodule update --init --depth=1 duckdb
      - name: Build matching DuckDB host
        run: |
          cmake -S duckdb -B build/validation-host -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_UNITTESTS=OFF \
            -DBUILD_EXTENSIONS="core_functions;parquet" \
            -DEXPORT_DYNAMIC_SYMBOLS=ON \
            -DCMAKE_EXE_LINKER_FLAGS="-static-libstdc++ -static-libgcc"
          cmake --build build/validation-host --target shell -j$(nproc)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: v2-validation-host
          path: build/validation-host/duckdb
          if-no-files-found: error
          retention-days: 1

  validate-bundled:
    if: github.event_name == 'merge_group'
    needs: [cuda-12, cuda-13, validation-host]
    strategy:
      fail-fast: false
      matrix:
        cuda:
          - version: "12"
            runner: ubuntu-22.04
          - version: "13"
            runner: ubuntu-24.04
    # TODO(mbrobbel): use gpu-t4 once its runner images expose libnvidia-ml.so.1.
    runs-on: ${{ fromJSON(format('["self-hosted", "{0}", "gpu-2xt4"]', matrix.cuda.runner)) }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: v2-validation-host
          path: build/validation-host
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: sirius-*-extension-linux_amd64-cuda${{ matrix.cuda.version }}
          merge-multiple: true
          path: build/bundled
      - name: Smoke-test bundled GPU execution
        env:
          SIRIUS_CONFIG_FILE: ${{ github.workspace }}/test/cpp/integration/integration.yaml
        run: |
          chmod +x build/validation-host/duckdb
          timeout --kill-after=10s 180s python3 test/scripts/v2_extension_smoke.py \
            --duckdb build/validation-host/duckdb \
            --extension build/bundled/sirius.duckdb_extension

  distribution:
    runs-on: ubuntu-slim
    needs: [cuda-12, cuda-13, validation-host, validate-bundled]
    if: always()
    steps:
      - name: Check
        run: |
          for r in "${{ needs.cuda-12.result }}" "${{ needs.cuda-13.result }}" "${{ needs.validation-host.result }}" "${{ needs.validate-bundled.result }}"; do
            case "$r" in failure|cancelled) echo "distribution build $r"; exit 1 ;; esac
          done
          echo "ok (cuda-12=${{ needs.cuda-12.result }}, cuda-13=${{ needs.cuda-13.result }})"
