# .github/workflows/auto-assign.yml
name: Auto Assign PR

on:
  pull_request_target:
    types: [ opened, reopened, synchronize ]

permissions:
  pull-requests: write

jobs:
  assign-author:
    runs-on: ubuntu-slim
    steps:
      - uses: toshimaru/auto-author-assign@a78a94b219445cece8ccf0d45fec60af449f212a #v3.0.3
        with:
          skip-users: |
            siriusdbbot
