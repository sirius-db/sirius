# .github/workflows/auto-assign.yml
name: Auto Assign PR

on:
  pull_request_target:
    types: [ opened, reopened, synchronize, ready_for_review ]

permissions:
  pull-requests: write

jobs:
  assign-author:
    runs-on: ubuntu-slim
    if: ${{ !github.event.pull_request.draft }}
    steps:
      - uses: toshimaru/auto-author-assign@415448809ea5ba0e171b251632720b009df3d8d6 #v3.0.3
        with:
          skip-users: |
            siriusdbbot
