name: CI Feature / Runner Request
description: Request a new runner type, size, capability, or CI workflow improvement
labels: ["ci", "enhancement"]
title: "[CI-ENH] "
body:
  - type: markdown
    attributes:
      value: |
        Use this template to request new runner types or sizes, new GPU configurations,
        caching improvements, new CI capabilities, or changes to how self-hosted runners work.

  - type: textarea
    id: use-case
    attributes:
      label: Use case and motivation
      description: What are you trying to accomplish, and what's getting in the way?
      placeholder: |
        "SNMG tests require 2x L4 GPUs but only 4x L4 runners exist — co-scheduled 2x runners
        would halve cost for jobs that only need 2 GPUs."
    validations:
      required: true

  - type: dropdown
    id: request-type
    attributes:
      label: Request type
      options:
        - New runner type / size
        - New GPU configuration
        - New CI workflow capability
        - Caching improvement
        - Runner image change
        - Performance improvement
        - Other
    validations:
      required: true

  - type: textarea
    id: requirements
    attributes:
      label: Technical requirements
      description: Fill in what's relevant — leave blank what isn't
      value: |
        - OS: ubuntu-24.04 / ubuntu-22.04 / other:
        - CUDA version: cuda-13 / cuda-12 / none
        - GPUs needed: 0 / 1 / 2 / 4
        - Approximate vCPU:
        - Approximate RAM:
        - Runs-on label wanted: [self-hosted, ubuntu-24.04, ...]
        - Spot acceptable: yes / no
    validations:
      required: false

  - type: textarea
    id: usage
    attributes:
      label: Expected usage
      description: How often and how many concurrent jobs?
      placeholder: "~10 jobs/day, up to 3 concurrent during active development"
    validations:
      required: false

  - type: dropdown
    id: blocking
    attributes:
      label: Is this blocking current work?
      options:
        - "Yes — blocking a PR or active development"
        - "Partially — workaround exists but is painful"
        - "No — improvement / future work"
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Links to related PRs, benchmarks, cost estimates, prior discussion
    validations:
      required: false
