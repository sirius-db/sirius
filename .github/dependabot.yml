version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: cargo
    directories:
      - /rust
      - /experimental/starrocks
      - /experimental/doris
    schedule:
      interval: daily
    allow:
      - dependency-type: all
    groups:
      arrow-parquet:
        patterns:
          - "arrow*"
          - "parquet*"
      protobuf:
        patterns:
          - "pbjson*"
          - "prost*"
          - "protox*"
          - "tonic*"
          - "substrait*"
      cxx:
        patterns:
          - "cxx*"
      cargo:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
