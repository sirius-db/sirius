version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily

  - package-ecosystem: cargo
    directories:
      - /rust
      - /experimental/starrocks
      - /experimental/doris
    schedule:
      interval: daily
    allow:
      - dependency-type: all
    groups:
      arrow-parquet:
        patterns:
          - "arrow*"
          - "parquet*"
