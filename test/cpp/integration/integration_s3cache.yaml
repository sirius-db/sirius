sirius:
  topology:
    num_gpus: 1
  memory:
    gpu:
      # The live S3 cache tests exercise host_read caching and need almost no GPU memory.
      # Keep their cudaMallocAsync pool prime small on 12 GB CI GPUs; integration.yaml's
      # 0.5 fraction is intentionally left unchanged for large SQL/SF10 coverage.
      usage_limit_fraction: 0.25
      reservation_limit_fraction: 1.0
    host:
      capacity_bytes: 32000000000
      initial_number_pools: 10
      pool_size: 512
      block_size: 1048576
  executor:
    pipeline:
      num_threads: 4
    task_creator:
      num_threads: 2
    downgrade:
      num_threads: 1
      monitor_period: 10ms
  operator_params:
    scan_task_batch_size: 100000000
    max_sort_partition_bytes: 0
    hash_partition_bytes: 100000000
    concat_batch_bytes: 100000000
    max_build_hash_table_bytes: 90000000
