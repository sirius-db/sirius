# MinIO single-node stack used by the [s3][integration] Catch2 tests and by
# the optional SQLLogicTest at test/sql/datasource/s3_read.test.
#
# Pinned to an exact release rather than `:latest` so that the same sirius
# commit produces reproducible test behavior over time; bump when a newer
# stable release is known to work with our SigV4 flow.
#
# Bring up:  docker compose -f test/cpp/integration/s3/docker-compose.yml up -d
# Tear down: docker compose -f test/cpp/integration/s3/docker-compose.yml down -v

services:
  minio:
    image: docker.1ms.run/minio/minio
    container_name: sirius-test-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_REGION: us-east-1
    ports:
      - "127.0.0.1:9000:9000"   # S3 API
      - "127.0.0.1:9001:9001"   # Web console
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/ready"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - minio-data:/data

volumes:
  minio-data:
