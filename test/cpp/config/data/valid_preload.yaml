sirius:
  topology:
    num_gpus: 1
  executor:
    preload:
      concurrent_preloads: 3
      cpu_affinity: [0, 1]
      device_preloading_budget: 0.3
      device_preloading_ceiling: 0.5
      gpu_speculative_headroom_fraction: 0.15
      host_headroom_fraction: 0.2
      speculative_fraction: 0.1
      max_batch_fraction: 0.05
      max_inflight_fraction: 0.15
      head_margin_tasks: 6
      lookahead_tasks: 12
      repository_window: 3
      repository_partition_lookahead: 2
      stage_to_host: false
      max_promotions_per_batch: 4
      max_lock_attempts: 5
      max_candidates: 1024
