# integration.yaml with the table path of GROUP BY on and a table capped at 64 KiB, so the fold
# returns most rows to the existing path, and with one scan batch per row group. For
# test/fuzz/config/agg_table.toml. Keep in sync with test/cpp/integration/integration.yaml.
sirius:
  topology:
    num_gpus: 1
  memory:
    gpu:
      usage_limit_fraction: 0.4
      reservation_limit_fraction: 1.0
    host:
      capacity_bytes: 32000000000
      initial_number_pools: 10
      pool_size: 512
      block_size: 1048576
  executor:
    pipeline:
      num_threads: 4
    task_creator:
      num_threads: 2
    downgrade:
      num_threads: 1
      monitor_period: 10ms
  operator_params:
    scan_task_batch_size: 1
    max_sort_partition_bytes: 0
    hash_partition_bytes: 100000000
    concat_batch_bytes: 100000000
    max_build_hash_table_bytes: 90000000
    agg_table_enabled: true
    agg_table_budget_bytes: 65536
