# Expected outcomes of the TPC-Havoc queries that don't run on the GPU yet, checked by
# test/cpp/integration/test_gpu_execution_tpch_havoc.cpp. Any query not listed here must run on
# the GPU and match DuckDB on the CPU. See test/README.md.
#
# Each entry groups the queries that fail for one root cause:
#   outcome:   plan_rejected, runtime_failed, mismatch or skip.
#   reason:    a regex the error must contain (plan_rejected, runtime_failed), or a description
#              (mismatch, skip).
#   issue:     the open issue that tracks the fix.
#   scan:      optional; native or parquet. Without it, the entry applies to both.
#   evaluator: optional; ast_interpret or ast_jit. Without it, the entry applies to both.
#   queries:   labels, such as Q05_V03.
# A fix that makes a query pass fails the test until the query is deleted from its entry.

expectations:
  - outcome: plan_rejected
    reason: Aggregates with a FILTER clause not supported in GPU
    issue: 2285
    queries: [Q01_V06, Q03_V07, Q04_V07, Q05_V07, Q06_V07, Q07_V07, Q08_V07, Q09_V07, Q10_V07,
              Q11_V07, Q12_V07, Q13_V07, Q14_V07, Q15_V07, Q16_V07, Q17_V07, Q18_V07]

  - outcome: plan_rejected
    reason: "Unsupported whole-partition window: FILTER"
    issue: 1745
    queries: [Q02_V07]

  - outcome: plan_rejected
    reason: "Unsupported whole-partition window: only SUM, AVG, COUNT, MIN and MAX aggregates are planned"
    issue: 1745
    queries: [Q02_V09, Q03_V09, Q15_V09, Q18_V09]

  - outcome: plan_rejected
    reason: "Unsupported whole-partition window: expressions over integer SUM results require an exact HUGEINT consumer"
    issue: 1745
    queries: [Q12_V09]

  - outcome: plan_rejected
    reason: Any join not supported
    issue: 2289
    queries: [Q15_V10]

  - outcome: plan_rejected
    reason: "Unsupported expression in aggregate .*: list\\("
    issue: 2290
    queries: [Q01_V07]

  # With Sirius loaded, binding fails with an INTERNAL error even on the CPU, which invalidates the
  # database for every later test.
  - outcome: skip
    reason: INTERNAL binder error on native tables whenever Sirius is loaded
    issue: 2294
    scan: native
    queries: [Q02_V08]
