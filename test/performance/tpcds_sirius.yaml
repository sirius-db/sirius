# bench/sf1000-repro/sirius-sf1000.yaml with host memory scaled down; no disk tier.
sirius:
    topology:
        num_gpus: 1
    memory:
        gpu:
            downgrade_trigger_fraction: 0.9
            downgrade_stop_fraction: 0.85
        host:
            capacity_bytes: 200000000000
            initial_number_pools: 160
            pool_size: 8
            block_size: 67108864
    executor:
        scan_manager:
          memory_prefetcher:
            enable: true
            num_threads: 3
          num_threads: 18
          uring_n_reactors: 4
        pipeline:
            num_threads: 8
        task_creator:
            num_threads: 4
    operator_params:
        scan_task_batch_size: 8GB
    telemetry:
        enable_quent: false
