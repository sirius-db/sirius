# Probe arm 'both': output compression AND the in-place device downgrade tier, in ONE
# process. Diagnostic only, not a benchmark arm.
#
# Output compression runs on the task-executor threads; the device tier runs on the
# downgrade thread. If output compresses batches while the device tier declines every
# one of them with `cuLaunchKernel failed: invalid resource handle`, the difference is
# the calling thread's CUDA context, not memory pressure and not the codec.
#
# Otherwise identical to fourway_device.yaml.
sirius:
  topology:
    num_gpus: 1
  memory:
    gpu:
      usage_limit_fraction: 0.30
      reservation_limit_fraction: 0.9
      downgrade_trigger_fraction: 0.6
      downgrade_stop_fraction: 0.4
    host:
      capacity_bytes: 28000000000
      initial_number_pools: 10
      pool_size: 512
      block_size: 1048576
    disk:
      disk_id: 0
      capacity_bytes: 100000000000
      downgrade_root_dirs: "/tmp/sirius_disk_memory"
  executor:
    pipeline:
      num_threads: 4
      thread_name_prefix: "sirius_pipeline_executor"
    downgrade:
      num_threads: 1
      thread_name_prefix: "sirius_downgrade_executor"
  operator_params:
    scan_task_batch_size: 134217728   # 128 MB
    max_sort_partition_bytes: 0               # 0: auto (33% GPU memory)
    hash_partition_bytes: 134217728           # 128 MB
    concat_batch_bytes: 134217728             # 128 MB
  compression:
    enable_pin_table_compression: false
    min_batch_size_bytes: 0
    max_compressed_fraction: 0.75
    column_threads: 4
    input_plan_dir: /home/jhoozemans/workspace/sirius/sirius/src/compression/simpatico_codegen/plans/tpch_sf1000
    enable_spill_compression: false
    enable_output_compression: true
    enable_device_compression_downgrade: true
    output_compression_min_ratio: 3.0
    output_compression_min_compress_gbps: 250.0
    output_compression_min_decompress_gbps: 250.0
