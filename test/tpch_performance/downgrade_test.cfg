# Config for testing downgrade behavior with early memory pressure.
#
# GPU downgrade fractions are relative to total GPU memory.
# For a 24 GB GPU:  trigger ~5 GB (0.21), stop ~3 GB (0.125)
# For a 48 GB GPU:  trigger ~10 GB,        stop ~6 GB
# For a 80 GB GPU:  trigger ~17 GB,        stop ~10 GB
#
# Adjust downgrade_trigger_fraction / downgrade_stop_fraction if your
# GPU size differs and you want the 5 GB threshold exactly.
#
# Run with:
#   export SIRIUS_CONFIG_FILE=$(pwd)/test/tpch_performance/downgrade_test.cfg
#   SIRIUS_LOG_LEVEL=info ./test/tpch_performance/run_tpch_parquet.sh sirius 100 1 5
#
# Check the sirius log file for "[downgrade]" messages.

sirius = {
    topology = {
        num_gpus = 1;
    };
    memory = {
        gpu = {
            # Full GPU memory available for reservations
            usage_limit_fraction = 0.9;
            reservation_limit_fraction = 1.0;
            # Trigger downgrade at ~10.4% of GPU memory (~5 GB on 48 GB GPU)
            downgrade_trigger_fraction = 0.104;
            # Stop downgrading at ~6.25% (~3 GB on 48 GB GPU)
            downgrade_stop_fraction = 0.0625;
        };
        host = {
            # 32 GB host memory for receiving downgraded data
            capacity_bytes = 32000000000;
            initial_number_pools = 40;
            pool_size = 512;
            block_size = 1048576;
        };
    };
    executor = {
        pipeline = {
            num_threads = 4;
        };
        duckdb_scan = {
            num_threads = 4;
            cache = true;
        };
        task_creator = {
            num_threads = 4;
        };
        downgrade = {
            num_threads = 4;
        };
    };
};
