# Per-query scan cache level overrides for Sirius engine.
# Used in multi-session mode only. In single-session mode, the cache level
# comes from the Sirius config YAML (executor.duckdb_scan.cache).
#
# Valid levels: none, parquet, table_host, table_gpu
# Queries not listed here use the Sirius config default (no SET emitted).
#
# Example:
# 1: parquet
# 7: parquet
