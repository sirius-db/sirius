#
# Phase-5 HOST-pinned bar cell (SF1000, GB300): the proven "Example config (GB300, SF1000)" from
# test/tpch_performance/run.md, with telemetry disabled because Quent's per-event write cost on
# the timed path is unmeasured and therefore excluded from every timing cell. Use with:
#
#   pixi run python test/tpch_performance/performance_test.py \
#       --mode ab --cell host_pinned --pin host --config test/tpch_performance/phase5_host_pinned.yaml ...
#
# Host pool: capacity 471.2 GB, preallocation 785 x 512 x 1 MiB = 401,920 MiB (~421 GB). Verified
# against /proc/meminfo on pmgb300ws-0391 (2026-08-15): MemTotal 771,857,272 kB (~790 GB), so the
# preallocation leaves ~369 GB for OS, process, and page cache. In the pinned cell the page cache
# is irrelevant after the pin, so this is ample; the from-disk cell must NOT reuse this pool size
# (see phase5_from_disk.yaml for that arithmetic).
sirius:
  topology:
    num_gpus: 1
  memory:
    gpu:
      usage_limit_fraction: 0.9
      reservation_limit_fraction: 1.0
      downgrade_trigger_fraction: 0.8
      downgrade_stop_fraction: 0.6
    host:
      capacity_bytes: 471200000000       # ~471 GB
      initial_number_pools: 785
      pool_size: 512
      block_size: 1048576                # 1 MB
  executor:
    pipeline:
      num_threads: 4
    downgrade:
      num_threads: 1
    task_creator:
      num_threads: 6
  operator_params:
    scan_task_batch_size: 5368709120       # 5 GB
    max_sort_partition_bytes: 0            # 0 = auto (33% GPU memory)
    hash_partition_bytes: 5368709120       # 5 GB
    concat_batch_bytes: 5368709120         # 5 GB
  telemetry:
    enable_quent: false
