// NIXL metadata exchange gRPC service definition.
//
// Defines the gRPC service interface for GPU-direct exchange coordination.
// This service runs alongside PBackendService on each Sirius BE.

syntax = "proto3";

package doris.nixl;

import "nixl_exchange.proto";

// NIXL metadata exchange service for GPU-direct transfers.
//
// Protocol flow:
// 1. Sender calls ExchangeMetadata with src buffer descriptors + nixl metadata
// 2. Receiver loads sender metadata, allocates + registers GPU buffers
// 3. Receiver returns dst buffer descriptors + own nixl metadata
// 4. Sender loads receiver metadata, initiates RDMA transfer via nixl
// 5. Sender calls TransferComplete to notify receiver
// 6. Receiver copies GPU→CPU, feeds into ExchangeBuffer
service NixlMetadataService {
  // Phase 1: Exchange metadata and allocate destination buffers.
  rpc ExchangeMetadata(PExchangeNixlMetadataRequest) returns (PExchangeNixlMetadataResponse);

  // Phase 2: Notify receiver that nixl transfer is complete.
  rpc TransferComplete(PNixlTransferCompleteRequest) returns (PNixlTransferCompleteResponse);
}
