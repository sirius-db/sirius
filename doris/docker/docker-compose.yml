# Doris FE + Sirius GPU BE.
# All on a Docker bridge network with fixed IPs.
# Sirius BE binary is bind-mounted from the host build.
#
# Usage:
#   pixi run -e doris doris-docker-up    # start cluster
#   pixi run -e doris doris-docker-down  # stop and remove
#   pixi run -e doris doris-docker-logs  # tail logs
services:
  doris-fe:
    image: apache/doris:fe-4.0.3
    container_name: doris-fe
    hostname: doris-fe
    environment:
      - FE_SERVERS=fe1:172.20.80.2:9010
      - FE_ID=1
    ports:
      - "9030:9030"
      - "8030:8030"
    volumes:
      - doris-fe-meta:/opt/apache-doris/fe/doris-meta
      - doris-fe-log:/opt/apache-doris/fe/log
      - ./fe-custom.conf:/opt/apache-doris/fe/conf/fe.conf
    networks:
      doris_net:
        ipv4_address: 172.20.80.2
    healthcheck:
      test: ["CMD", "bash", "-c", "curl -s http://172.20.80.2:8030/api/health | grep -q success"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s

  # doris-be:
  #   image: apache/doris:be-4.0.3
  #   container_name: doris-be
  #   hostname: doris-be
  #   depends_on:
  #     doris-fe:
  #       condition: service_healthy
  #   environment:
  #     - FE_SERVERS=fe1:172.20.80.2:9010
  #     - BE_ADDR=172.20.80.3:9050
  #   volumes:
  #     - doris-be-storage:/opt/apache-doris/be/storage
  #     - doris-be-log:/opt/apache-doris/be/log
  #   networks:
  #     doris_net:
  #       ipv4_address: 172.20.80.3

  sirius-be: &sirius-be
    image: ubuntu:22.04
    container_name: sirius-be
    hostname: sirius-be
    ipc: host
    cap_add:
      - SYS_PTRACE
    depends_on:
      doris-fe:
        condition: service_healthy
    environment:
      - LD_LIBRARY_PATH=/opt/nix-glibc:/opt/pixi-lib:/opt/pixi-nixl-lib:/opt/pixi-default/lib:/usr/local/nvidia/lib64
      - RUST_LOG=doris_rpc=debug,plan_translator=debug,sirius_ffi=debug,info
      - SIRIUS_EXTENSION_DIR=/opt/extensions
      - NIXL_PLUGIN_DIR=/opt/pixi-nixl-lib/plugins
      - UCX_COMPONENT_DIR=/opt/pixi-nixl-lib/ucx
      - UCX_LOG_LEVEL=info
      - UCX_MEMTYPE_CACHE=n
      - UCX_MEMTYPE_REG_WHOLE_ALLOC_TYPES=cuda
      - UCX_RNDV_FRAG_MEM_TYPE=cuda
      - UCX_MAX_RNDV_RAILS=1
    volumes:
      - /nix/store/wb6rhpznjfczwlwx23zmdrrw74bayxw4-glibc-2.42-47/lib:/opt/nix-glibc:ro
      - ../../.pixi/envs/doris/lib:/opt/pixi-lib:ro
      - ../../.pixi/envs/doris-nixl/lib:/opt/pixi-nixl-lib:ro
      - ../../.pixi/envs/default:/opt/pixi-default:ro
      # Mount at the host path too — the sirius extension has a hardcoded RPATH.
      - ../../.pixi/envs/default/lib:/home/matthijs/sirius/.pixi/envs/default/lib:ro
      - ../target/release/sirius-doris-be:/opt/sirius-doris-be:ro
      - ../../build/release/extension/sirius/sirius.duckdb_extension:/opt/extensions/sirius.duckdb_extension:ro
      - ../thirdparty/duckdb-substrait-extension/build/release/extension/substrait/substrait.duckdb_extension:/opt/extensions/substrait.duckdb_extension:ro
      - /tmp/claude/cities.parquet:/data/cities.parquet:ro
      - /tmp/claude/orders.parquet:/data/orders.parquet:ro
      - /tmp/claude/customers.parquet:/data/customers.parquet:ro
      - /data/tpch:/data/tpch:ro
    entrypoint:
      - /opt/nix-glibc/ld-linux-x86-64.so.2
      - /opt/sirius-doris-be
    command:
      - --heartbeat-port=19050
      - --be-port=19060
      - --brpc-port=18060
      - --http-port=18040
      - --arrow-flight-port=18071
      - --fe=172.20.80.2:9030
      - --advertise-host=172.20.80.4
    deploy:
      resources:
        reservations:
          devices:
            - driver: cdi
              device_ids:
                - nvidia.com/gpu=all
              capabilities: [gpu]
    networks:
      doris_net:
        ipv4_address: 172.20.80.4

  sirius-be-2:
    <<: *sirius-be
    container_name: sirius-be-2
    hostname: sirius-be-2
    command:
      - --heartbeat-port=19050
      - --be-port=19060
      - --brpc-port=18060
      - --http-port=18040
      - --arrow-flight-port=18071
      - --fe=172.20.80.2:9030
      - --advertise-host=172.20.80.5
    networks:
      doris_net:
        ipv4_address: 172.20.80.5

networks:
  doris_net:
    ipam:
      config:
        - subnet: 172.20.80.0/24

volumes:
  doris-fe-meta:
  doris-fe-log:
  doris-be-storage:
  doris-be-log:
