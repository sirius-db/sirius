// Sirius GPU Backend configuration for host (non-Docker) with 2 BEs sharing 1 GPU.
// Each BE gets ~20% of GPU memory. Place/symlink at ~/.sirius/sirius.cfg
sirius = {
    topology = {
        num_gpus = 1;
    };
    memory = {
        gpu = {
            usage_limit_fraction = 0.2;
            reservation_limit_fraction = 0.2;
            downgrade_trigger_fraction = 0.15;
            downgrade_stop_fraction = 0.1;
            track_per_stream_reservation = false;
        };
        host = {
            capacity_bytes = 4294967296;  // 4GB per BE
            reservation_limit_fraction = 0.9;
            downgrade_trigger_fraction = 0.8;
            downgrade_stop_fraction = 0.7;
        };
        disk = {
            disk_id = 0;
            capacity_bytes = 1099511627776;  // 1TB
            downgrade_root_dirs = "/tmp/sirius_disk_memory";
        };
    };
    executor = {
        pipeline = {
            num_threads = 4;
        };
        duckdb_scan = {
            cache = false;
            num_threads = 4;
        };
    };
};
