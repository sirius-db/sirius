// Sirius GPU Backend configuration for Docker CDI environment.
// Mounted into container at /root/.sirius/sirius.cfg
sirius = {
    topology = {
        num_gpus = 1;
    };
    memory = {
        gpu = {
            usage_limit_fraction = 0.9;
            reservation_limit_fraction = 0.9;
            downgrade_trigger_fraction = 0.8;
            downgrade_stop_fraction = 0.7;
            track_per_stream_reservation = false;
        };
        host = {
            capacity_bytes = 8589934592;  // 8GB per NUMA node
            reservation_limit_fraction = 0.9;
            downgrade_trigger_fraction = 0.8;
            downgrade_stop_fraction = 0.7;
        };
        disk = {
            disk_id = 0;
            capacity_bytes = 1099511627776;  // 1TB
            downgrade_root_dirs = "/tmp/sirius_disk_memory";
        };
    };
    executor = {
        pipeline = {
            num_threads = 4;
        };
        duckdb_scan = {
            cache = false;
            num_threads = 4;
        };
    };
};
