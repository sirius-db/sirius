sirius:
  memory:
    gpu:
      usage_limit_fraction: 0.95
      reservation_limit_fraction: 0.85
      downgrade_trigger_fraction: 0.8
      downgrade_stop_fraction: 0.6
    host:
      reservation_limit_fraction: 1.0
      downgrade_trigger_fraction: 0.93
      downgrade_stop_fraction: 0.83
      block_size: 1Mi
      pool_size: 512
      initial_number_pools: 864
      capacity_bytes: 432Gi
    disk:
      disk_id: 0
      capacity_bytes: 2Ti
      downgrade_root_dirs: /opt/dlami/nvme/spill
  executor:
    task_creator:
      num_threads: 4
    pipeline:
      num_threads: 4
    downgrade:
      num_threads: 8
    scan_manager:
      num_threads: 24
      backend: native
      rest_n_reactors: 8
      rest:
        pin_to_irq_cpus: false
        max_connections: 512
        min_mtu: 8000
        conn_max_age_s: 300
      max_readahead_scans: 16
      cache:
        mode: cucs
        eviction: idle
        min_prefetching_budget_fraction: 0.05
        eviction_threshold_fraction: 0.8
      memory_prefetcher:
        enable: false
  operator_params:
    max_broadcast_join_size: 2GiB
    max_sort_partition_bytes: 0
    hash_partition_bytes: 8GB
    concat_batch_bytes: 3GB
    max_build_hash_table_bytes: 16GB
    max_build_probe_resident_bytes: 8GB
  compression:
    enable_spill_compression: false
