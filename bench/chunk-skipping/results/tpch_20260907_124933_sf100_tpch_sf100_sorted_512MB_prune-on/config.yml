# Phase 1 of CHUNK_SKIPPING_PLAN.md: SF100 on GB300, all tables GPU-tier compressed.
#
# scan_task_batch_size is DELIBERATELY left out — run-sweep.sh injects it, because the sweep
# uses it as a granularity dial: smaller batches => smaller pin chunks => finer zone maps,
# which is what a per-group index would do, without building one. See §7 Phase 1.
sirius:
    topology:
        num_gpus: 1
    memory:
        gpu:
            usage_limit_fraction: 0.95
            reservation_limit_fraction: 1.0
            downgrade_trigger_fraction: 0.9
            downgrade_stop_fraction: 0.85
        host:
            capacity_bytes: 120000000000
            initial_number_pools: 100
            pool_size: 8
            block_size: 67108864
        disk:
            disk_id: 0
            capacity_bytes: 200000000000
            downgrade_root_dirs: "/datasets/.sirius_disk_memory"
    executor:
        scan_manager:
          memory_prefetcher:
            enable: true
            num_threads: 3
          num_threads: 18
          use_sirius_datasource: true
          uring_n_reactors: 4
          enable_prefetch_cache: false
        pipeline:
            num_threads: 8
        downgrade:
            num_threads: 1
        task_creator:
            num_threads: 4
    operator_params:
        scan_task_batch_size: 512MB
        enable_pinned_zone_map_pruning: true
        max_sort_partition_bytes: 0
        hash_partition_bytes: 32GB
        concat_batch_bytes: 5GB
        max_build_hash_table_bytes: 32GB
    telemetry:
        enable_quent: false
        output_directory: telemetry_data
        engine_name: siriusDB
