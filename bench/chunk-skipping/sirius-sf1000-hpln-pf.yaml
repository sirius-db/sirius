# SF1000 .hpln scans on GB300 — UNPINNED, which is what it is tuned for.
#
# Unlike its SF100 sibling, scan_task_batch_size is set here rather than injected: for a .hpln
# source the batch size is not a granularity dial, because pruning resolution comes from the
# file's own chunks and zone-map groups rather than from how a pin was cut. 8GB is the value
# sf1000-repro settled on.
#
# The host pool is sized for scan staging, NOT for pinning: 200 GB, against the 471.2 GB that
# bench/sf1000-repro/sirius-sf1000.yaml reserves. Use that one for a pin comparison; this one
# would leave a .hpln pin of lineitem (220 GB) nowhere to go.
sirius:
    topology:
        num_gpus: 1
    memory:
        gpu:
            usage_limit_fraction: 0.95
            reservation_limit_fraction: 1.0
            downgrade_trigger_fraction: 0.9
            downgrade_stop_fraction: 0.85
        host:
            capacity_bytes: 200000000000
            initial_number_pools: 168
            pool_size: 8
            block_size: 67108864
        disk:
            disk_id: 0
            capacity_bytes: 200000000000
            downgrade_root_dirs: "/datasets/.sirius_disk_memory"
    executor:
        scan_manager:
          memory_prefetcher:
            enable: true
            num_threads: 3
          num_threads: 18
          use_sirius_datasource: true
          uring_n_reactors: 4
          enable_prefetch_cache: true
        pipeline:
            num_threads: 8
        downgrade:
            num_threads: 1
        task_creator:
            num_threads: 4
    operator_params:
        scan_task_batch_size: 8GB
        max_sort_partition_bytes: 0
        hash_partition_bytes: 32GB
        concat_batch_bytes: 5GB
        max_build_hash_table_bytes: 32GB
    telemetry:
        enable_quent: false
        output_directory: telemetry_data
        engine_name: siriusDB
