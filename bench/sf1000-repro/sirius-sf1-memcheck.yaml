# SF1 small-scale CONCURRENT repro config for compute-sanitizer / diagnostic
# runs. Derived from sirius-sf1000.yaml with memory limits shrunk so the SAME
# pressure regime (downgrade churn, parked-batch conversions, RF-window
# eviction storms) fires at SF1 sizes: the freed-while-in-use class needs
# owner-death under pressure, not scale. DIAGNOSTIC ONLY — never quote scores.
sirius:
    topology:
        num_gpus: 1
    memory:
        gpu:
            # ~2.6 GB of the 256 GB HBM: SF1 pins (~1 GB) + working set forces
            # the downgrade/upgrade churn that a 95% cap only reaches at SF1000.
            usage_limit_fraction: 0.010
            reservation_limit_fraction: 1.0
            downgrade_trigger_fraction: 0.60
            downgrade_stop_fraction: 0.45
        host:
            capacity_bytes: 68719476736
            initial_number_pools: 64
            pool_size: 8
            block_size: 67108864
        disk:
            disk_id: 0
            capacity_bytes: 100000000000
            downgrade_root_dirs: "/localhome/local-faramburu/sirius_disk_memory"
    executor:
        scan_manager:
          memory_prefetcher:
            enable: true
            num_threads: 3
          num_threads: 18
          use_sirius_datasource: true
          uring_n_reactors: 4
          enable_prefetch_cache: false
        pipeline:
            num_threads: 8
            thread_name_prefix: "sirius_pipeline_executor"
        downgrade:
            num_threads: 1
            thread_name_prefix: "sirius_downgrade_executor"
        task_creator:
            num_threads: 4
            thread_name_prefix: "sirius_task_creator"
    operator_params:
        # Small batches -> many parked batches per scan -> maximal
        # convert/evict traffic per query second.
        scan_task_batch_size: 64MB
        max_sort_partition_bytes: 0
        hash_partition_bytes: 512MB
        concat_batch_bytes: 64MB
        max_build_hash_table_bytes: 512MB
    telemetry:
        enable_quent: false
        output_directory: telemetry_data
        engine_name: siriusDB
