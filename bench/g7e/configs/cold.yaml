sirius:
  topology:
    num_gpus: 1
    gpus_per_query: 0

  compression:
    enable_spill_compression: true

  memory:
    gpu:
      usage_limit_fraction: 0.95
      reservation_limit_fraction: 0.9
      downgrade_trigger_fraction: 0.8
      downgrade_stop_fraction: 0.6
    host:
      capacity_bytes: 225Gi
      reservation_limit_fraction: 1.0
      downgrade_trigger_fraction: 0.9
      downgrade_stop_fraction: 0.8
      pool_size: 512
      initial_number_pools: 300
    disk:
      disk_id: 0
      capacity_bytes: 1Ti
      downgrade_root_dirs: "/mnt/datasets/spill"

  executor:
    task_creator:
      num_threads: 2
    pipeline:
      num_threads: 4
    downgrade:
      num_threads: 4
    scan_manager:
      num_threads: 24
      backend: native
      rest_n_reactors: 4
      rest:
        pin_to_irq_cpus: false
        max_connections: 128
        min_mtu: 8000
      max_readahead_scans: 16
      cache:
        mode: cucs
        eviction: idle
        min_prefetching_budget_fraction: 0.05
        eviction_threshold_fraction: 0.8
      memory_prefetcher:
        enable: false
