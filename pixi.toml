[workspace]
channels = ["rapidsai", "conda-forge"]
name = "sirius"
platforms = ["linux-64", "linux-aarch64"]
requires-pixi = ">=0.65"

[activation]
scripts = ["scripts/pixi_activate.sh"]

[dependencies]
bc = "*"
clang = "21.*"
clangxx = "21.*"
clang-tools = "21.*"
cmake = "4.1.*"
cuda-nvcc = "*"
cuda-nvml-dev = "*"
cxx-compiler = "*"
duckdb = "=1.4.4"
libabseil = "*"
libconfig = "*"
libcurand-dev = "*"
librmm = "*"
make = "*"
mold = "*"
ninja = "*"
pkg-config = "*"
pre-commit = "*"
sccache = "*"
spdlog = "1.8.*"
sqlite = ">=3.52.0,<4"
unzip = "*"
wget = "*"

[tasks.configure]
args = [
  { arg = "preset", default = "release", choices = [
    "debug",
    "release",
    "relwithdebinfo",
    "clang-debug",
    "clang-release",
    "clang-relwithdebinfo",
  ] },
  { arg = "cudaarchs", default = "" },
]
cmd = "{% if cudaarchs %}CUDAARCHS={{ cudaarchs }} {% endif %}cmake -S duckdb --preset {{ preset }}"
inputs = ["CMakePresets.json", "CMakeLists.txt", "extension_config.cmake"]
outputs = [
  "build/{{ preset }}/CMakeCache.txt",
]

[tasks.build]
args = [
  { arg = "preset", default = "release", choices = [
    "debug",
    "release",
    "relwithdebinfo",
    "clang-debug",
    "clang-release",
    "clang-relwithdebinfo",
  ] },
  { arg = "cudaarchs", default = "" },
]
cmd = "cmake --build build/{{ preset }}"
depends-on = [{ task = "configure", args = [{ preset = "{{ preset }}" }, { cudaarchs = "{{ cudaarchs }}" }] }]
inputs = [
  "src/**/*.cpp",
  "src/**/*.cu",
  "src/**/*.cuh",
  "src/**/*.h",
  "src/**/*.hpp",
  "test/**/*.cpp",
  "test/**/*.hpp",
  "test/sql/**/*",
]

[tasks.test]
args = [
  { arg = "preset", default = "release", choices = [
    "debug",
    "release",
    "relwithdebinfo",
    "clang-debug",
    "clang-release",
    "clang-relwithdebinfo",
  ] },
]
cmd = "ctest --test-dir build/{{ preset }}/extension/sirius"
depends-on = [{ task = "build", args = [{ preset = "{{ preset }}" }] }]

[tasks.sql-test]
args = [
  { arg = "preset", default = "release", choices = [
    "debug",
    "release",
    "relwithdebinfo",
    "clang-debug",
    "clang-release",
    "clang-relwithdebinfo",
  ] },
  { arg = "filter", default = "" },
]
cmd = "build/{{ preset }}/test/unittest --test-dir .{% if filter %} {{ filter }}{% endif %}"
depends-on = [{ task = "build", args = [{ preset = "{{ preset }}" }] }]

[tasks.unittest]
args = [
  { arg = "preset", default = "release", choices = [
    "debug",
    "release",
    "relwithdebinfo",
    "clang-debug",
    "clang-release",
    "clang-relwithdebinfo",
  ] },
  { arg = "filter", default = "" },
]
cmd = "build/{{ preset }}/extension/sirius/test/cpp/sirius_unittest{% if filter %} {{ filter }}{% endif %}"
depends-on = [{ task = "build", args = [{ preset = "{{ preset }}" }] }]

[tasks.duckdb]
args = [
  { arg = "preset", default = "release", choices = [
    "debug",
    "release",
    "relwithdebinfo",
    "clang-debug",
    "clang-release",
    "clang-relwithdebinfo",
  ] },
]
cmd = "build/{{ preset }}/duckdb"
depends-on = [{ task = "build", args = [{ preset = "{{ preset }}" }] }]

[tasks.clean]
args = [
  { arg = "preset", default = "release", choices = [
    "debug",
    "release",
    "relwithdebinfo",
    "clang-debug",
    "clang-release",
    "clang-relwithdebinfo",
  ] },
]
cmd = "rm -rf build/{{ preset }}"

[feature.cuda13]
system-requirements = { cuda = "13" }

[feature.cuda13.dependencies]
cuda-version = "13.*"
libcudf = "26.04.*"

[feature.cuda13.activation.env]
CUDAARCHS = "75-real;80-real;86-real;90a-real;100f-real;120a-real;120"

[feature.cuda12]
system-requirements = { cuda = "12" }

[feature.cuda12.dependencies]
cuda-version = "12.*"
libcudf = "26.04.*"

[feature.cuda12.activation.env]
CUDAARCHS = "75-real;80-real;86-real;90a-real"

[feature.duckdb-python.dependencies]
pip = "*"
python = ">=3.12"
pybind11 = ">=2.6.0"
scikit-build-core = ">=0.11.4"
setuptools-scm = ">=8.0"

[feature.duckdb-python.tasks]
build-duckdb-python = "CMAKE_ARGS=\"-DDUCKDB_SOURCE_PATH=$PIXI_PROJECT_ROOT/duckdb\" pip install --no-build-isolation ./duckdb-python"

# Lightweight env for running nightly cudf builds (no build deps needed)
[feature.nightly-runner.dependencies]
pixi = "*"

[feature.nightly-runner.tasks]
nightly-shell = "scripts/generate_nightly_env.sh && env -u PIXI_ENVIRONMENT_NAME pixi shell --manifest-path envs/nightly/pixi.toml"
nightly-run = "scripts/generate_nightly_env.sh && env -u PIXI_ENVIRONMENT_NAME pixi run --manifest-path envs/nightly/pixi.toml"

[environments]
default = ["cuda13"]
cuda12 = ["cuda12"]
duckdb-python = ["duckdb-python"]
nightly-runner = { features = ["nightly-runner"], no-default-feature = true }
