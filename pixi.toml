[workspace]
channels = ["rapidsai-nightly", "conda-forge", "nvidia" ]
name = "sirius"
platforms = ["linux-64", "linux-aarch64"]
requires-pixi = ">=0.59"

[activation]
scripts = ["setup_test_datasets.sh"]

[dependencies]
cmake = "4.1.*"
cuda-nvcc = "*"
cuda-nvml-dev = "*"
cxx-compiler = "*"
clang = "*"
clangxx = "*"
clang-tools = "*"
make = "*"
ninja = "*"
sccache = "*"
unzip = "*"

libcudf = "26.04.*"
librmm = "26.04.*"
libcurand-dev = "*"
pre-commit = "*"
libconfig = "*"
libabseil = ">=20260107.0"
duckdb = ">=1.4.4,<2"

[tasks.configure-debug]
cmd = "cmake -S duckdb -B build/debug -C CMake/debug.cmake"
description = "Configure a debug build with no optimizations"

[tasks.configure-release]
cmd = "cmake -S duckdb -B build/release -C CMake/release.cmake"
description = "Configure an optimized release build"

[tasks.configure-relwithdebinfo]
cmd = "cmake -S duckdb -B build/relwithdebinfo -C CMake/relwithdebinfo.cmake"
description = "Configure a release build with debug symbols"

[tasks.build-debug]
cmd = "cmake --build build/debug --parallel {{jobs}}"
args = [{arg="jobs", default="4"}]
depends-on = ["configure-debug"]
description = "Build in debug mode"

[tasks.build-release]
cmd = "cmake --build build/release --parallel {{jobs}}"
args = [{arg="jobs", default="4"}]
depends-on = ["configure-release"]
description = "Build in release mode"

[tasks.build-relwithdebinfo]
cmd = "cmake --build build/relwithdebinfo --parallel {{jobs}}"
args = [{arg="jobs", default="4"}]
depends-on = ["configure-relwithdebinfo"]
description = "Build in release mode with debug symbols"

[tasks.sql-logic-tests-release]
cmd = "$PIXI_PROJECT_ROOT/build/release/test/unittest \"$PIXI_PROJECT_ROOT/test/*\""
description = "Run SQL logic tests for a release build"

# CUDA version features: use `pixi run -e cuda12` for CUDA 12.x systems
[feature.cuda13.system-requirements]
cuda = "13"

[feature.cuda13.dependencies]
cuda-version = "13.*"

[feature.cuda13.activation.env]
# GPU architectures: Turing through Blackwell (75, 80, 86, 90a, 100f, 120a, 120)
CUDAARCHS = "75-real;80-real;86-real;90a-real;100f-real;120a-real;120"

[feature.cuda12.system-requirements]
cuda = "12"

[feature.cuda12.dependencies]
cuda-version = "12.*"

[feature.cuda12.activation.env]
# GPU architectures: Turing through Hopper (75, 80, 86, 90a)
CUDAARCHS = "75-real;80-real;86-real;90a-real"

[environments]
default = ["cuda13"]
cuda12 = ["cuda12"]
