[workspace]
channels = ["rapidsai", "conda-forge" ]
name = "sirius"
platforms = ["linux-64", "linux-aarch64"]
requires-pixi = ">=0.59"

[activation]
scripts = ["setup_test_datasets.sh"]

[dependencies]
cmake = "4.1.*"
cuda-nvcc = "*"
cuda-nvml-dev = "*"
cxx-compiler = "*"
make = "*"
ninja = "*"
sccache = "*"
unzip = "*"

libcudf = "26.02.*"
librmm = "*"
libcurand-dev = "*"
pre-commit = "*"
libconfig = "*"
libabseil = ">=20260107.0"
duckdb = ">=1.4.4,<2"
spdlog = "1.8.*"

[tasks]

# CUDA version features: use `pixi run -e cuda12` for CUDA 12.x systems
[feature.cuda13.system-requirements]
cuda = "13"

[feature.cuda13.dependencies]
cuda-version = "13.*"

[feature.cuda13.activation.env]
# GPU architectures: Turing through Blackwell (75, 80, 86, 90a, 100f, 120a, 120)
CUDAARCHS = "75-real;80-real;86-real;90a-real;100f-real;120a-real;120"

[feature.cuda12.system-requirements]
cuda = "12"

[feature.cuda12.dependencies]
cuda-version = "12.*"

[feature.cuda12.activation.env]
# GPU architectures: Turing through Hopper (75, 80, 86, 90a)
CUDAARCHS = "75-real;80-real;86-real;90a-real"

# Doris Rust BE feature: extra deps for building doris/ workspace
[feature.doris.dependencies]
rust = ">=1.85"
libprotobuf = ">=5"
thrift-compiler = ">=0.22"

[feature.doris.tasks]
doris-check = { cmd = "cargo check", cwd = "doris", description = "Check doris workspace" }
doris-build = { cmd = "cargo build --release", cwd = "doris", description = "Build doris workspace" }
doris-test = { cmd = "cargo test", cwd = "doris", description = "Test doris workspace" }

# Doris FE feature: build & run Doris Frontend from source for testing
[feature.doris-fe.dependencies]
openjdk = "17.*"
maven = ">=3.9"
mysql = "*"
cmake = ">=3.20"
cxx-compiler = "*"
make = "*"
flex = "*"
bison = "*"

[feature.doris-fe.tasks]
doris-fe-thrift = { cmd = """bash -c 'set -e
  THRIFT_VER=0.16.0
  echo "==> Downloading thrift $THRIFT_VER..."
  mkdir -p doris/thirdparty
  curl -sL http://archive.apache.org/dist/thrift/$THRIFT_VER/thrift-$THRIFT_VER.tar.gz | tar xz -C doris/thirdparty
  echo "==> Building thrift compiler..."
  cd doris/thirdparty/thrift-$THRIFT_VER
  mkdir -p build && cd build
  cmake .. -DBUILD_COMPILER=ON -DBUILD_TESTING=OFF -DBUILD_TUTORIALS=OFF \
    -DBUILD_LIBRARIES=OFF -DBUILD_JAVA=OFF -DBUILD_PYTHON=OFF \
    -DWITH_OPENSSL=OFF -DWITH_LIBEVENT=OFF \
    -DCMAKE_POLICY_VERSION_MINIMUM=3.5
  make -j$(nproc)
  echo "==> thrift compiler built: $(pwd)/compiler/cpp/bin/thrift"
'""", outputs = ["doris/thirdparty/thrift-0.16.0/build/compiler/cpp/bin/thrift"], description = "Build thrift 0.16.0 compiler from source" }

doris-fe-build = { cmd = """bash -c 'set -e
  DORIS_SRC=doris/thirdparty/apache-doris
  THRIFT=doris/thirdparty/thrift-0.16.0/build/compiler/cpp/bin/thrift

  echo "==> Generating Java Thrift stubs with thrift 0.16.0..."
  THRIFT_DIR=$DORIS_SRC/gensrc/thrift
  BUILD_DIR=$DORIS_SRC/gensrc/build
  mkdir -p $BUILD_DIR/gen_java
  for f in $THRIFT_DIR/*.thrift; do
    $THRIFT -I $THRIFT_DIR --gen java:fullcamel -out $BUILD_DIR/gen_java --allow-64bit-consts -strict "$f"
  done

  echo "==> Copying generated Thrift Java to fe-common..."
  rm -rf $DORIS_SRC/fe/fe-common/src/main/java/org/apache/doris/thrift
  rm -rf $DORIS_SRC/fe/fe-common/src/main/java/org/apache/parquet
  cp -r $BUILD_DIR/gen_java/org/apache/doris/thrift $DORIS_SRC/fe/fe-common/src/main/java/org/apache/doris/
  if [ -d $BUILD_DIR/gen_java/org/apache/parquet ]; then
    cp -r $BUILD_DIR/gen_java/org/apache/parquet $DORIS_SRC/fe/fe-common/src/main/java/org/apache/
  fi

  echo "==> Creating stub directories..."
  mkdir -p $DORIS_SRC/thirdparty/installed/webroot
  mkdir -p $DORIS_SRC/thirdparty/installed/jindofs_libs

  echo "==> Building FE with Maven..."
  export DORIS_HOME=$(pwd)/$DORIS_SRC
  cd $DORIS_SRC/fe
  mvn install -pl fe-common -DskipTests -Dcheckstyle.skip=true -Dskip.plugin=true -T 1C
  mvn package -pl fe-core -DskipTests -Dcheckstyle.skip=true -T 1C

  echo "==> Assembling FE output..."
  cd ..
  mkdir -p output/fe/bin output/fe/conf output/fe/lib output/fe/log output/fe/doris-meta
  mkdir -p output/fe/webroot/static output/fe/plugins/jdbc_drivers
  cp bin/*_fe.sh output/fe/bin/
  cp conf/fe.conf output/fe/conf/
  rm -rf output/fe/lib/*
  cp fe/fe-core/target/lib/* output/fe/lib/
  cp fe/fe-core/target/doris-fe.jar output/fe/lib/
  echo "==> Done"
'""", depends-on = ["doris-fe-thrift"], description = "Build Doris FE from source (Maven)" }

doris-fe = { cmd = "bin/start_fe.sh --console", cwd = "doris/thirdparty/apache-doris/output/fe", depends-on = ["doris-fe-build"], description = "Build and run Doris FE in foreground" }
doris-fe-show-be = { cmd = "bash -c 'mysql -h 127.0.0.1 -P 9030 -u root -e \"SHOW BACKENDS\\G\"'", description = "Show registered backends" }

[environments]
default = ["cuda13"]
cuda12 = ["cuda12"]
doris = ["cuda13", "doris"]
doris-fe = ["doris-fe"]
