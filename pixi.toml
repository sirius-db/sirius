[workspace]
channels = ["rapidsai", "conda-forge"]
name = "sirius"
platforms = ["linux-64", "linux-aarch64"]
requires-pixi = ">=0.65"

[environments]
default = ["dev-libs", "cuda13"]
cuda12 = ["dev-libs", "cuda12"]
cuda13 = ["dev-libs", "cuda13"]
vcpkg = ["vcpkg", "cuda13"]
vcpkg-cuda12 = ["vcpkg", "cuda12"]

[activation]
scripts = ["scripts/pixi_activate.sh"]

[dependencies]
clang = "21.*"
clang-tools = "21.*"
cmake = "4.*"
cuda-nvcc = "*"
cuda-nvml-dev = "*"
cxx-compiler = "*"
make = "*"
mold = "*"
ninja = "*"
pkg-config = "*"
pre-commit = "*"
sccache = "*"
unzip = "*"
wget = "*"

[feature.dev-libs.dependencies]
libcudf = "26.02.*"
librmm = "*"
libcurand-dev = "*"
libconfig = "*"
libabseil = "*"
duckdb = "1.4.*"
spdlog = "1.8.*"

[feature.cuda12.dependencies]
cuda-version = "12.*"

[feature.cuda13.dependencies]
cuda-version = "13.*"

[tasks.configure]
args = [
  { arg = "preset", default = "release", choices = [
    "debug",
    "release",
    "relwithdebinfo",
    "clang-debug",
    "clang-release",
    "clang-relwithdebinfo",
  ] },
  { arg = "cudaarchs", default = "" },
]
cmd = "{% if cudaarchs %}CUDAARCHS={{ cudaarchs }} {% endif %}cmake -S duckdb --preset {% if 'vcpkg' in pixi.environment.name %}vcpkg-{% endif %}{{ preset }}"
inputs = ["CMakePresets.json", "CMakeLists.txt", "extension_config.cmake"]
outputs = [
  "build/{% if 'vcpkg' in pixi.environment.name %}vcpkg-{% endif %}{{ preset }}/CMakeCache.txt",
]

[tasks.build]
args = [
  { arg = "preset", default = "release", choices = [
    "debug",
    "release",
    "relwithdebinfo",
    "clang-debug",
    "clang-release",
    "clang-relwithdebinfo",
  ] },
  { arg = "cudaarchs", default = "" },
]
cmd = "cmake --build build/{% if 'vcpkg' in pixi.environment.name %}vcpkg-{% endif %}{{ preset }}"
depends-on = [{ task = "configure", args = [{ preset = "{{ preset }}" }, { cudaarchs = "{{ cudaarchs }}" }] }]
inputs = [
  "src/**/*.cpp",
  "src/**/*.cu",
  "src/**/*.cuh",
  "src/include/**/*.h",
  "src/include/**/*.hpp",
  "test/**/*.cpp",
  "test/sql/**/*",
]

[tasks.test]
args = [
  { arg = "preset", default = "release", choices = [
    "debug",
    "release",
    "relwithdebinfo",
    "clang-debug",
    "clang-release",
    "clang-relwithdebinfo",
  ] },
  { arg = "filter", default = "" },
]
cmd = "ctest --test-dir build/{% if 'vcpkg' in pixi.environment.name %}vcpkg-{% endif %}{{ preset }}/extension/sirius"
depends-on = [{ task = "build", args = [{ preset = "{{ preset }}" }] }]

[tasks.clean]
args = [
  { arg = "preset", default = "release", choices = [
    "debug",
    "release",
    "relwithdebinfo",
    "clang-debug",
    "clang-release",
    "clang-relwithdebinfo",
  ] },
]
cmd = "rm -rf build/{% if 'vcpkg' in pixi.environment.name %}vcpkg-{% endif %}{{ preset }}"


[feature.cuda13]
system-requirements = { cuda = "13" }
activation.env = { CUDAARCHS = "75-real;80-real;86-real;90a-real;100f-real;120a-real;120" }

[feature.cuda12]
system-requirements = { cuda = "12" }
activation.env = { CUDAARCHS = "75-real;80-real;86-real;90a-real" }

[feature.vcpkg.dependencies]
bison = "*"
libnvjitlink-dev = "*"
cuda-nvrtc-dev = "*"
libcurand-dev = "*"
flex = "*"
patchelf = "*"
zip = "*"

[feature.vcpkg.activation]
scripts = ["scripts/vcpkg.sh"]
