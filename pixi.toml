[workspace]
channels = ["rapidsai", "conda-forge" ]
name = "sirius"
platforms = ["linux-64", "linux-aarch64"]
requires-pixi = ">=0.59"

[activation]
scripts = ["scripts/pixi_activate.sh"]

[dependencies]
cmake = "4.1.*"
cuda-nvcc = "*"
cuda-nvml-dev = "*"
cxx-compiler = "*"
make = "*"
ninja = "*"
sccache = "*"
unzip = "*"
clang = ">=21,<22"
wget = "*"

libcudf = "26.02.*"
librmm = "*"
libcurand-dev = "*"
pre-commit = "*"
libconfig = "*"
libabseil = ">=20260107.0"
duckdb = ">=1.4.4,<2"
spdlog = "1.8.*"
clang-tools = ">=21.1.8,<22"

[tasks]
substrait-build = { cmd = "make -C substrait release GEN=ninja", description = "Build DuckDB substrait extension" }

# CUDA version features: use `pixi run -e cuda12` for CUDA 12.x systems
[feature.cuda13.system-requirements]
cuda = "13"

[feature.cuda13.dependencies]
cuda-version = "13.*"

[feature.cuda13.activation.env]
# GPU architectures: Turing through Blackwell (75, 80, 86, 90a, 100f, 120a, 120)
CUDAARCHS = "75-real;80-real;86-real;90a-real;100f-real;120a-real;120"

[feature.cuda12.system-requirements]
cuda = "12"

[feature.cuda12.dependencies]
cuda-version = "12.*"

[feature.cuda12.activation.env]
# GPU architectures: Turing through Hopper (75, 80, 86, 90a)
CUDAARCHS = "75-real;80-real;86-real;90a-real"

# Doris Rust BE feature: extra deps for building doris/ workspace
[feature.doris.dependencies]
rust = ">=1.85"
libprotobuf = ">=5"
thrift-compiler = ">=0.22"
clangdev = "*"
sysroot_linux-64 = ">=2.32"

[feature.doris.activation]
scripts = ["scripts/doris_activate.sh"]

[feature.doris.tasks]
doris-check = { cmd = "cargo check", cwd = "doris", description = "Check doris workspace" }
nixl-build = { cmd = """bash -c 'set -e
  NIXL_SRC=$PIXI_PROJECT_ROOT/doris/thirdparty/nixl

  if [ -f "$CONDA_PREFIX/lib/libnixl.so" ]; then
    echo "nixl already installed in conda prefix"
    exit 0
  fi

  echo "==> Building nixl from submodule..."
  cd "$NIXL_SRC"

  # Patch out Python bindings (no pybind11 needed)
  sed -i "/subdir..python/s/^/# /" src/bindings/meson.build 2>/dev/null || true

  echo "==> Building nixl with meson (UCX plugin only)..."
  rm -rf builddir
  meson setup builddir --prefix="$CONDA_PREFIX" --buildtype=release \
    -Ducx_path=$CONDA_PREFIX \
    -Dcudapath_inc=$CONDA_PREFIX/targets/x86_64-linux/include \
    -Dcudapath_lib=$CONDA_PREFIX/targets/x86_64-linux/lib \
    -Dcudapath_stub=$CONDA_PREFIX/targets/x86_64-linux/lib/stubs \
    -Drust=false \
    -Denable_plugins=UCX \
    -Dbuild_tests=false \
    -Dbuild_examples=false
  cd builddir
  ninja -j$(nproc)
  ninja install

  echo "==> nixl installed to $CONDA_PREFIX"
  ls "$CONDA_PREFIX/lib/"libnixl* 2>/dev/null || true
'""", description = "Build nixl C++ library from submodule into conda prefix" }
doris-build = { cmd = "NIXL_PREFIX=$CONDA_PREFIX NIXL_NO_STUBS_FALLBACK=1 cargo build --release", cwd = "doris", depends-on = ["nixl-build"], description = "Build doris workspace (with nixl)" }
doris-test = { cmd = "cargo test", cwd = "doris", description = "Test doris workspace" }
# Start Sirius GPU BEs with offset ports (for running alongside regular Doris BE)
sirius-be = { cmd = "doris/target/release/sirius-doris-be --heartbeat-port 19050 --be-port 19060 --brpc-port 18060 --http-port 18040 --arrow-flight-port 18071 --gpu-cache-size 2GB --gpu-processing-size 2GB --fe 127.0.0.1:9030", description = "Run Sirius GPU BE 1 (ports 19xxx/18xxx)" }
sirius-be-2 = { cmd = "bash -c 'mkdir -p /tmp/sirius-be-2/.sirius && cp -n ~/.sirius/sirius.cfg /tmp/sirius-be-2/.sirius/ 2>/dev/null; HOME=/tmp/sirius-be-2 exec doris/target/release/sirius-doris-be --heartbeat-port 29050 --be-port 29060 --brpc-port 28060 --http-port 28040 --arrow-flight-port 28071 --gpu-cache-size 2GB --gpu-processing-size 2GB --advertise-host 127.0.0.3 --fe 127.0.0.1:9030'", description = "Run Sirius GPU BE 2 (ports 29xxx/28xxx, separate HOME for lock)" }

# Doris FE feature: build & run Doris Frontend from source for testing
[feature.doris-fe.dependencies]
openjdk = "17.*"
maven = ">=3.9"
mysql = "*"
cmake = ">=3.20"
cxx-compiler = "*"
make = "*"
flex = "*"
bison = "*"

[feature.doris-fe.tasks]
doris-fe-thrift = { cmd = """bash -c 'set -e
  THRIFT_VER=0.16.0
  echo "==> Downloading thrift $THRIFT_VER..."
  mkdir -p doris/thirdparty
  curl -sL http://archive.apache.org/dist/thrift/$THRIFT_VER/thrift-$THRIFT_VER.tar.gz | tar xz -C doris/thirdparty
  echo "==> Building thrift compiler..."
  cd doris/thirdparty/thrift-$THRIFT_VER
  mkdir -p build && cd build
  cmake .. -DBUILD_COMPILER=ON -DBUILD_TESTING=OFF -DBUILD_TUTORIALS=OFF \
    -DBUILD_LIBRARIES=OFF -DBUILD_JAVA=OFF -DBUILD_PYTHON=OFF \
    -DWITH_OPENSSL=OFF -DWITH_LIBEVENT=OFF \
    -DCMAKE_POLICY_VERSION_MINIMUM=3.5
  make -j$(nproc)
  echo "==> thrift compiler built: $(pwd)/compiler/cpp/bin/thrift"
'""", outputs = ["doris/thirdparty/thrift-0.16.0/build/compiler/cpp/bin/thrift"], description = "Build thrift 0.16.0 compiler from source" }

doris-fe-build = { cmd = """bash -c 'set -e
  DORIS_SRC=doris/thirdparty/apache-doris
  THRIFT=doris/thirdparty/thrift-0.16.0/build/compiler/cpp/bin/thrift

  echo "==> Generating Java Thrift stubs with thrift 0.16.0..."
  THRIFT_DIR=$DORIS_SRC/gensrc/thrift
  BUILD_DIR=$DORIS_SRC/gensrc/build
  mkdir -p $BUILD_DIR/gen_java
  for f in $THRIFT_DIR/*.thrift; do
    $THRIFT -I $THRIFT_DIR --gen java:fullcamel -out $BUILD_DIR/gen_java --allow-64bit-consts -strict "$f"
  done

  echo "==> Copying generated Thrift Java to fe-common..."
  rm -rf $DORIS_SRC/fe/fe-common/src/main/java/org/apache/doris/thrift
  rm -rf $DORIS_SRC/fe/fe-common/src/main/java/org/apache/parquet
  cp -r $BUILD_DIR/gen_java/org/apache/doris/thrift $DORIS_SRC/fe/fe-common/src/main/java/org/apache/doris/
  if [ -d $BUILD_DIR/gen_java/org/apache/parquet ]; then
    cp -r $BUILD_DIR/gen_java/org/apache/parquet $DORIS_SRC/fe/fe-common/src/main/java/org/apache/
  fi

  echo "==> Creating stub directories..."
  mkdir -p $DORIS_SRC/thirdparty/installed/webroot
  mkdir -p $DORIS_SRC/thirdparty/installed/jindofs_libs

  echo "==> Building FE with Maven..."
  export DORIS_HOME=$(pwd)/$DORIS_SRC
  cd $DORIS_SRC/fe
  mvn install -pl fe-common -DskipTests -Dcheckstyle.skip=true -Dskip.plugin=true -T 1C
  mvn package -pl fe-core -DskipTests -Dcheckstyle.skip=true -T 1C

  echo "==> Assembling FE output..."
  cd ..
  mkdir -p output/fe/bin output/fe/conf output/fe/lib output/fe/log output/fe/doris-meta
  mkdir -p output/fe/webroot/static output/fe/plugins/jdbc_drivers
  cp bin/*_fe.sh output/fe/bin/
  cp conf/fe.conf output/fe/conf/
  rm -rf output/fe/lib/*
  cp fe/fe-core/target/lib/* output/fe/lib/
  cp fe/fe-core/target/doris-fe.jar output/fe/lib/

  echo "==> Installing fe-host.conf as fe.conf..."
  cp $PIXI_PROJECT_ROOT/doris/docker/fe-host.conf output/fe/conf/fe.conf
  echo "==> Done"
'""", inputs = ["doris/thirdparty/apache-doris/gensrc/thrift/*.thrift", "doris/thirdparty/apache-doris/fe/fe-core/src/**/*.java", "doris/thirdparty/apache-doris/fe/fe-common/src/**/*.java", "doris/thirdparty/apache-doris/fe/pom.xml"], outputs = ["doris/thirdparty/apache-doris/fe/fe-core/target/doris-fe.jar"], depends-on = ["doris-fe-thrift"], description = "Build Doris FE from source (Maven)" }

doris-fe-start = { cmd = "bin/start_fe.sh --console", cwd = "doris/thirdparty/apache-doris/output/fe", depends-on = ["doris-fe-build"], description = "Build (if needed) and run Doris FE in foreground" }
doris-fe = { cmd = "bin/start_fe.sh --console", cwd = "doris/thirdparty/apache-doris/output/fe", description = "Run Doris FE in foreground (skip build)" }
doris-fe-clean = { cmd = "rm -rf doris/thirdparty/apache-doris/output/fe/doris-meta doris/thirdparty/apache-doris/output/fe/log && mkdir -p doris/thirdparty/apache-doris/output/fe/doris-meta doris/thirdparty/apache-doris/output/fe/log", description = "Clean FE metadata and logs (fresh start)" }
doris-fe-show-be = { cmd = "bash -c 'mysql -h 127.0.0.1 -P 9030 -u root -e \"SHOW BACKENDS\\G\"'", description = "Show registered backends" }
doris-fe-add-sirius = { cmd = "bash -c 'mysql -h 127.0.0.1 -P 9030 -u root -e \"ALTER SYSTEM ADD BACKEND \\\"127.0.0.1:19050\\\"\"'", description = "Register Sirius GPU BE with local FE" }

# Doris C++ BE feature: build & run standard Doris Backend from source
[feature.doris-be.dependencies]
bash = "*"
openjdk = "17.*"
maven = ">=3.9"
cmake = ">=3.20"
cxx-compiler = "*"
make = "*"
ninja = "*"
python = ">=3.8"
flex = "*"
bison = "*"
ccache = "*"
mysql = "*"
automake = "*"
autoconf = "*"
libtool = "*"
pkg-config = "*"
binutils = "*"
patch = "*"
curl = "*"
wget = "*"
m4 = "*"
gettext = "*"
sed = "*"
gawk = "*"
tar = "*"
xz = "*"
gzip = "*"
coreutils = "*"
findutils = "*"
diffutils = "*"
grep = "*"

[feature.doris-be.tasks]
doris-be-byacc = { cmd = """bash -c 'set -e
  BYACC_DIR=doris/thirdparty/byacc
  if [ -x "$BYACC_DIR/byacc" ]; then echo "byacc already built"; exit 0; fi
  echo "==> Building byacc from source..."
  mkdir -p "$BYACC_DIR/src"
  curl -sL https://invisible-island.net/datafiles/release/byacc.tar.gz | tar xz -C "$BYACC_DIR/src" --strip-components=1
  cd "$BYACC_DIR/src"
  ./configure --prefix="$(cd .. && pwd)/install"
  make -j$(nproc)
  cp yacc "$(cd .. && pwd)/byacc"
  echo "==> byacc built: $(cd .. && pwd)/byacc"
'""", description = "Build byacc from source" }

doris-be-build = { cmd = """bash -c 'set -e
  echo "==> Patching shebangs for NixOS compatibility..."
  find doris/thirdparty/apache-doris -name "*.sh" -exec sed -i "s|^#!/bin/bash|#!/usr/bin/env bash|" {} +
  echo "==> Fixing hardcoded /usr/bin paths in pixi libtool scripts..."
  export SED="$(which sed)" GREP="$(which grep)" EGREP="$(which grep) -E" FGREP="$(which grep) -F"
  echo "==> Fixing broken Cwd::cwd in pixi perl (use getcwd instead)..."
  sed -i -e "s/use Cwd qw (cwd)/use Cwd qw (cwd getcwd)/" -e "s/= cwd;/= getcwd;/" .pixi/envs/doris-be/bin/autoreconf
  echo "==> Patching thirdparty build for NixOS..."
  sed -i "s/--with-cpp/--with-cpp --without-c_glib/" doris/thirdparty/apache-doris/thirdparty/build-thirdparty.sh
  sed -i "s/DFLATBUFFERS_BUILD_TESTS=OFF/DFLATBUFFERS_BUILD_TESTS=OFF -DCMAKE_CXX_STANDARD=17/" doris/thirdparty/apache-doris/thirdparty/build-thirdparty.sh
  HS_SRC=doris/thirdparty/apache-doris/thirdparty/src
  if [ ! -d "$HS_SRC/hyperscan-5.4.2" ] && [ -f "$HS_SRC/hyperscan-5.4.2.tar.gz" ]; then
    tar xzf "$HS_SRC/hyperscan-5.4.2.tar.gz" -C "$HS_SRC"
  fi
  if [ -f "$HS_SRC/hyperscan-5.4.2/cmake/build_wrapper.sh" ]; then
    sed -i "s|-p /tmp ||g" "$HS_SRC/hyperscan-5.4.2/cmake/build_wrapper.sh"
  fi
  echo "==> Pre-downloading gRPC third_party deps (googleapis, opencensus-proto, xds)..."
  GRPC_TP=doris/thirdparty/apache-doris/thirdparty/src/grpc-1.54.3/third_party
  if [ ! -d "$GRPC_TP/googleapis" ]; then
    mkdir -p "$GRPC_TP/googleapis"
    curl -sL https://github.com/googleapis/googleapis/archive/2f9af297c84c55c8b871ba4495e01ade42476c92.tar.gz | tar xz -C "$GRPC_TP/googleapis" --strip-components=1
  fi
  if [ ! -d "$GRPC_TP/opencensus-proto/src" ]; then
    mkdir -p "$GRPC_TP/opencensus-proto/src"
    curl -sL https://github.com/census-instrumentation/opencensus-proto/archive/v0.3.0.tar.gz | tar xz -C "$GRPC_TP/opencensus-proto/src" --strip-components=2
  fi
  if [ ! -d "$GRPC_TP/xds" ]; then
    mkdir -p "$GRPC_TP/xds"
    curl -sL https://github.com/cncf/xds/archive/32f1caf87195bf3390061c29f18987e51ca56a88.tar.gz | tar xz -C "$GRPC_TP/xds" --strip-components=1
  fi
  export PATH="$(pwd)/doris/thirdparty/byacc:$PATH"
  export CMAKE_POLICY_VERSION_MINIMUM=3.5
  mkdir -p /tmp/claude/doris-be-home /tmp/claude/doris-be-tmp
  export HOME=/tmp/claude/doris-be-home
  export TMPDIR=/tmp/claude/doris-be-tmp
  cd doris/thirdparty/apache-doris
  export DORIS_TOOLCHAIN=gcc
  export DISABLE_BE_JAVA_EXTENSIONS=ON
  export DISABLE_BUILD_AZURE=ON
  bash build.sh --be -j $(nproc)
'""", depends-on = ["doris-be-byacc"], description = "Build Doris C++ BE from source (includes thirdparty)" }

doris-be-start = { cmd = """bash -c 'set -e
  BE_DIR=doris/thirdparty/apache-doris/output/be
  mkdir -p $BE_DIR/storage $BE_DIR/log
  cd $BE_DIR
  bin/start_be.sh --console
'""", depends-on = ["doris-be-build"], description = "Build (if needed) and run Doris BE in foreground" }

doris-be = { cmd = """bash -c 'set -e
  BE_DIR=doris/thirdparty/apache-doris/output/be
  mkdir -p $BE_DIR/storage $BE_DIR/log
  cd $BE_DIR
  bin/start_be.sh --console
'""", description = "Run Doris BE in foreground (skip build)" }

doris-be-show-be = { cmd = "bash -c 'mysql -h 127.0.0.1 -P 9030 -u root -e \"SHOW BACKENDS\\G\"'", description = "Show registered backends" }
doris-be-add-be = { cmd = "bash -c 'mysql -h 127.0.0.1 -P 9030 -u root -e \"ALTER SYSTEM ADD BACKEND \\\"127.0.0.1:9050\\\"\"'", description = "Register regular BE with FE" }

# NIXL GPU-direct exchange: build deps for building the nixl C++ library
[feature.nixl.dependencies]
ucx = ">=1.20"
meson = ">=1.0"
pkg-config = "*"
clangdev = "*"

[feature.nixl.tasks]

[environments]
default = ["cuda13"]
cuda12 = ["cuda12"]
doris = ["cuda13", "doris", "nixl"]
doris-fe = ["doris-fe"]
doris-be = ["doris-be"]
