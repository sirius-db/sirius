version: 1

project:
  name: "sirius"
  description: "DuckDB GPU Extension for GPU-accelerated SQL"

commands:
  build:
    - name: build
      description: "Standard build with make (all cores)"
      command: "make -j$(nproc)"
      timeout: 900

    - name: build-nightly
      description: "Nightly build via pixi nightly-runner environment"
      command: "pixi run -e nightly-runner nightly-run"
      timeout: 1800

  test:
    - name: unit-tests
      description: "Run C++ unit tests (abort on first failure). Pass filter= to restrict to a Catch2 test-spec."
      command: "./build/release/extension/sirius/test/cpp/sirius_unittest --abort {filter}"
      timeout: 1800
      output_parser: gtest
      args:
        - name: filter
          description: "Catch2 test-spec filter (e.g. '[followup-17]'). Empty string runs all tests."
          type: string
          default: ""

  benchmark:
    - name: tpch-benchmark
      description: "Run TPC-H benchmark and validate results"
      command: "./test/tpch_performance/benchmark_and_validate.sh {scale_factor}"
      timeout: 3600
      args:
        - name: scale_factor
          description: "TPC-H scale factor (1, 10, 100)"
          type: number
          default: 1

    - name: tpch-parquet
      description: "Run TPC-H queries against Parquet files. Set SIRIUS_CONFIG_FILE in the environment before starting Claude."
      command: "./test/tpch_performance/run_tpch_parquet.sh --parquet-dir {parquet_dir} --iterations {iterations} --timeout {timeout} {engine} {scale_factor} $(seq {first_query} {last_query})"
      timeout: 7200
      args:
        - name: engine
          description: "Engine to benchmark (sirius or duckdb)"
          type: string
          default: "sirius"
        - name: scale_factor
          description: "TPC-H scale factor (1, 10, 100)"
          type: number
          default: 100
        - name: parquet_dir
          description: "Directory containing TPC-H parquet files"
          type: string
          default: "/home/felipe/sirius/test_datasets/tpch/sf100"
        - name: first_query
          description: "First query number in range"
          type: number
          default: 1
        - name: last_query
          description: "Last query number in range"
          type: number
          default: 22
        - name: iterations
          description: "Number of iterations per query (1 cold + N-1 warm)"
          type: number
          default: 2
        - name: timeout
          description: "Per-session timeout in seconds (0 = no timeout)"
          type: number
          default: 1200

    - name: tpch-report
      description: "Generate report from existing benchmark results"
      command: "./test/tpch_performance/benchmark_and_validate.sh --report {run_dir}"
      timeout: 120
      args:
        - name: run_dir
          description: "Path to previous benchmark run directory"
          type: string

  diagnostics:
    - name: nvidia-smi
      description: "Show GPU status, utilization, memory, and processes"
      command: "nvidia-smi"
      timeout: 30

    - name: gpu-monitor
      description: "Monitor GPU utilization for a given duration (1-second samples)"
      command: "timeout {duration} nvidia-smi dmon -s pucvmet -d 1"
      timeout: 120
      args:
        - name: duration
          description: "Monitoring duration in seconds"
          type: number
          default: 10

  lint:
    - name: pre-commit
      description: "Run pre-commit hooks on all files"
      command: "pre-commit run --all-files"
      timeout: 120

  configure:
    - name: cmake-debug
      description: "Configure CMake with debug preset (GCC)"
      command: "cmake --preset debug"
      timeout: 120

    - name: cmake-release
      description: "Configure CMake with release preset (GCC)"
      command: "cmake --preset release"
      timeout: 120

    - name: cmake-clang-release
      description: "Configure CMake with Clang release preset"
      command: "cmake --preset clang-release"
      timeout: 120

    - name: cmake-vcpkg-release
      description: "Configure CMake with vcpkg release preset"
      command: "cmake --preset vcpkg-release"
      timeout: 120

  clean:
    - name: clean
      description: "Remove build directory"
      command: "rm -rf build"
      timeout: 60

debug:
  tools:
    valgrind:
      default_flags: "--leak-check=full --track-origins=yes --suppressions=valgrind.supp"
    compute-sanitizer:
      default_flags: "--tool memcheck --leak-check full"
    gdb:
      default_flags: "-q"
  asan_build_command: "CXXFLAGS='-fsanitize=address -fno-omit-frame-pointer' LDFLAGS='-fsanitize=address' make -j$(nproc)"
  coredump_directory: "/tmp/cores"
  log_directory: "/tmp/sirius-debug-logs"
