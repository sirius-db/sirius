# GB200 nodes, 4 GPUs each. The settings docs/super-sirius/distributed-experiments.md used for
# SF30000 and SF100000 on 2 and 4 nodes; every other key at the engine's default.
sirius:
  memory:
    host: { capacity_bytes: 180Gi }
    disk: { disk_id: 0, capacity_bytes: 1000000000000, downgrade_root_dirs: "@SPILL@" }
  executor:
    scan_manager: { num_threads: 32, uring_n_reactors: 4, cache: { mode: none } }
  operator_params:
    max_dynamic_filter_bloom_bytes_per_gpu: 8Gi
    max_build_probe_resident_bytes: 64Gi
    max_build_hash_table_bytes: 64Gi
