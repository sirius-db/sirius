# One GB200 node reading Parquet through GPUDirect Storage, after docs/super-sirius/gds-runbook.md.
# Needs --env UCX_NET_DEVICES=<the interface the ranks reach each other on>. Read the runbook
# first: probe the node, and tell the storage admins before the first GDS run on it.
sirius:
  memory:
    host: { capacity_bytes: 180Gi }
    disk: { disk_id: 0, capacity_bytes: 1000000000000, downgrade_root_dirs: "@SPILL@" }
  executor:
    scan_manager:
      backend: gds
      gds: { num_threads: 8, read_timeout_s: 30 }
      num_threads: 32
      uring_n_reactors: 4
      cache: { mode: none }
  operator_params:
    max_dynamic_filter_bloom_bytes_per_gpu: 8Gi
    max_build_probe_resident_bytes: 64Gi
    max_build_hash_table_bytes: 64Gi
    enable_complete_group_having: true
