[package]
name = "sirius-starrocks-cn"
version = "0.1.0"
edition = "2024"

[workspace]
members = [
    "crates/starrocks-plan-translator",
    "crates/starrocks-thrift",
]
resolver = "2"

[workspace.dependencies]
anyhow = "1"
# Pinned to the arrow version `parquet` already pulls in, so the engine→CN result interchange
# (Arrow C Data Interface) and the parquet schema reader share one arrow build.
arrow-array = "59"
arrow-schema = "59"
backon = { version = "1", default-features = false, features = ["tokio-sleep"] }
clap = { version = "4", features = ["derive", "env"] }
mysql_async = { version = "0.37", default-features = false, features = ["minimal-rust"] }
# Keep this stack aligned so `substrait-explain` can format the same protobuf
# types emitted by `substrait`, and so generated messages share one `prost`
# runtime across the translator crate.
prost = "0.14"
prost-build = "0.14"
parquet = { version = "59", default-features = false, features = ["arrow", "async"] }
heck = "0.5"
prettyplease = "0.2"
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "parsing"] }
substrait = "0.63.0"
substrait-explain = "0.7.0"
thiserror = "2"
thrift = "0.24"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = "1"

[features]
# On by default so a normal build links the GPU engine. CI disables it
# (`--no-default-features`) to keep the pure-Rust thrift/translator build and
# tests buildable without a Sirius build tree or a GPU.
default = ["sirius-engine"]
# Bring up an embedded Sirius engine context for the compute node.
sirius-engine = ["dep:sirius"]

[dependencies]
anyhow.workspace = true
arrow-array.workspace = true
arrow-schema.workspace = true
backon.workspace = true
clap.workspace = true
mysql_async.workspace = true
parquet.workspace = true
prost.workspace = true
# Optional: links the local Sirius engine build tree (gated by the
# `sirius-engine` feature). Path dependency on the sibling `rust/` workspace.
sirius = { path = "../../rust/crates/sirius", optional = true }
starrocks-plan-translator = { path = "crates/starrocks-plan-translator" }
starrocks-thrift = { path = "crates/starrocks-thrift" }
thiserror.workspace = true
thrift.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tower.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[build-dependencies]
heck.workspace = true
prettyplease.workspace = true
proc-macro2.workspace = true
prost-build.workspace = true
quote.workspace = true
syn.workspace = true

[dev-dependencies]
# The engine integration test builds a local_files Substrait plan + a parquet fixture.
substrait.workspace = true
tempfile = "3"
