# Engine B (stock StarRocks 3.5.20) BE1 config -- 4x GB200 Grace box, 2-BE topology.
#
# Copy target: $HOME/starrocks-bench/be1/conf/be.conf
# Launch:      $HOME/starrocks-bench/be1/bin/start_be.sh --daemon --numa 0
#              (start_backend.sh:134-136 turns --numa 0 into
#               `numactl --cpubind 0 --membind 0`, wrapped around the BE binary itself)
#
# BE1 owns NUMA node 0: CPUs 0-71, 489,960 MiB (478.48 GiB) of LPDDR.
#
# *** ONLY --numa 0 AND --numa 1 ARE EVER VALID ON THIS BOX. ***
# numactl nodes 2, 10, 18 and 26 are GPU HBM (188,416 MiB each, ZERO CPUs). RUN_NUMA is
# substituted into BOTH --cpubind and --membind (start_backend.sh:136), so `--numa 2` would
# membind this BE into GPU0's HBM on a node with no CPUs. That is an instant failure at best
# and corruption of a GPU the Sirius CNs use at worst.
#
# Every key below is annotated CHANGED (with the 3.5.20 default and the reason) or UNCHANGED.
# Anything not listed keeps its compiled default from be/src/common/config.h.

# UNCHANGED. Keeps the BE on loopback, matching the FE's priority_networks and the
# `ALTER SYSTEM ADD BACKEND "127.0.0.1:9050"` registration address.
priority_networks = 127.0.0.1/32

#####################################################################
## Memory
#####################################################################

# CHANGED from the 3.5.20 default "90%" (config.h:84).
#
# *** ON THIS BOX mem_limit MUST BE AN ABSOLUTE BYTE VALUE. NEVER A PERCENTAGE. ***
# MemInfo::init() (be/src/util/mem_info.cpp:66-91) reads /proc/meminfo MemTotal, which here
# is 1,775,050,816 kB = 1692.6 GiB because the kernel counts the four 184 GiB GPU HBM NUMA
# nodes (2/10/18/26) as system memory. Only 979,783 MiB = 956.82 GiB is CPU-addressable
# LPDDR. set_memlimit_if_container() (mem_info.cpp:113-117) returns early without /.dockerenv
# and there is no cgroup limit, so nothing corrects this. The stock "90%" therefore resolves
# to ~1523 GiB per BE -- 1.6x the real LPDDR, on a box with Swap: 0. That is a guaranteed
# OOM-kill, and the `bytes_limit > physical_mem()` guard at exec_env.cpp:191 cannot catch it
# because physical_mem() is itself the wrong number.
#
# 240G is the SF100 number. Derivation (full arithmetic in README.md):
#   CPU-addressable LPDDR                                     956.82 GiB
#   - fixed tenants (mmfsd 50.7 + FE JVM ~20 + kernel ~10)      84.00
#   - 2 BEs x 240 GiB                                          480.00
#   = kernel page cache left                                   392.82 GiB
# 392.82 GiB is 402.2 "GB" in the same MiB/1000 unit the box brief uses for "~980 GB LPDDR",
# so this CLEARS the OPEN-ISSUES M1 item 3 ">=400 GB left for page cache" bar -- and it is
# 15x the 26 GiB SF100 dataset, so the entire working set stays resident.
#
# Per-node check against the HARD membind ceiling (478.48 GiB on node 0):
#   478.48 - 240 (BE1) - ~20 (FE JVM) - ~25 (mmfsd share) - ~5 (kernel) = ~188 GiB slack.
# A --membind is a hard cap: a BE that exceeds its node's LPDDR is OOM-killed, it does NOT
# fall back to the other socket. That slack absorbs jemalloc fragmentation and the
# connector-scan thread stacks.
#
# Note StarRocks applies a further x0.9 on top: exec_env.cpp:184-186 sets the SOFT tracker
# limit to 0.9 * mem_limit = 216 GiB. mem_limit itself is the hard RSS ceiling and is what
# must be budgeted against -- do not budget against 0.9*mem_limit.
#
# 240 GiB is 3-5x any plausible per-BE TPC-H SF100 peak (q18/q21 hash builds), so engine B
# will never spill and is NOT handicapped by this choice. If be.INFO ever shows
# "Memory of process exceed limit" or any spill at SF100, 300G still fits the per-node
# ceiling -- but note that raising it drops page cache to 332.8 GiB and breaks the M1 bar,
# so record it as a deliberate deviation.
#
# *** SF1000: change this to 224G on BOTH BEs. *** At SF1000 the M1 page-cache bar becomes
# genuinely binding (the dataset is 265 GB and a warm pass must cache all of it):
#   956.82 - 84 - 2*224 = 424.82 GiB = 435.0 "GB" of page cache, > the 247 GiB dataset,
# with 34 GiB of headroom above the bar. See README.md.
mem_limit = 240G

# CHANGED from the default false (config.h:306; storage_page_cache_limit = "20%",
# config.h:305). storage_page_cache caches pages of NATIVE OLAP tablets. This benchmark has
# no native tables at all -- both engines read the same parquet through FILES()
# (REPRODUCE.md: "there is no loading step"). Left enabled it reserves up to 20% of the
# process tracker (~64 GiB at mem_limit=320G) for a cache that can never fill.
disable_storage_page_cache = true

# CHANGED from the default "0" (config.h:1297). This is the cache that DOES apply to FILES()
# external parquet scans. datacache_enable is already true by default (config.h:1296) but
# sized ZERO, and datacache_auto_adjust_enable (config.h:1342) only grows the DISK quota
# after disk_idle_seconds_for_expansion = 7200 s of disk idle (config.h:1353) -- far longer
# than a benchmark run. So stock 3.5.20 caches nothing here despite reporting the cache as
# enabled. 32G holds the entire 26 GiB SF100 dataset in-process. This comes OUT of mem_limit,
# so it is not double-counted against the budget above.
datacache_mem_size = 32G

# CHANGED from the default "0" -- set explicitly to 0 to pin the behavior rather than leave
# it to the auto-adjust heuristic above. At SF100 the 32G memory tier already covers the
# whole dataset, so a disk tier would only add first-pass write amplification.
# For SF1000, set this to 200G (it lives under storage_root_path, which is local NVMe RAID
# below -- never point it at NFS).
datacache_disk_size = 0

#####################################################################
## CPU / thread pools -- sized for 72 cores, not 144
#####################################################################

# CHANGED from the default 0 (config.h:574).
#
# *** THIS IS MANDATORY WHENEVER --numa IS USED. ***
# CpuInfo counts `processor` lines in /proc/cpuinfo (cpu_info.cpp:150-152, 165-166) and only
# shrinks for a cgroup cpuset or quota (cpu_info.cpp:272-341). It NEVER calls
# sched_getaffinity, so `numactl --cpubind 0` does not reduce the detected core count -- the
# BE would still report 144. cpu_info.cpp:173
# (`if (config::num_cores > 0) num_cores_ = config::num_cores;`) is the only override.
# Without this, each pinned BE builds 144-wide thread pools for 72 usable cores, and the FE
# would see 2 x 144 = 288 cores on a 144-core box.
num_cores = 72

# CHANGED from the default true (config.h:1514).
# When enabled the BE pins resource-group worker threads to CpuInfo::get_core_ids(), which
# enumerates all 144 cores regardless of the numactl cpuset. Under --cpubind 0 the BE would
# fight its own numactl mask trying to bind threads to cores 72-143. exec_env.cpp:697-699
# only auto-disables this for cgroup-quota-without-cpuset, which does not apply here.
enable_resource_group_bind_cpus = false

# CHANGED from the default 8 (config.h:885).
# This sizes the CONNECTOR scan pool -- ceil(value * num_cores) -- which is the pool FILES()
# actually uses (exec_env.cpp:683). At the default that is 8 * 72 = 576 threads per BE,
# 1152 across both BEs on 144 physical cores. 4 gives 288 per BE (4 threads/core), still a
# deep enough queue for GPFS, which is where the source parquet lives. Drop to 2 if `vmstat 1`
# shows a sustained run queue above ~72 per socket.
pipeline_connector_scan_thread_num_per_cpu = 4

# CHANGED from the default 16 (config.h:1035). GPFS is a high-latency, high-throughput
# filesystem that rewards deep IO queues. This is an adaptive CEILING, not a floor
# (connector_io_tasks_min_size = 2, _adjust_interval_ms = 50, _slow_io_latency_ms = 50 --
# config.h:1036-1041), so raising it cannot hurt a latency-sensitive phase. Primary sweep knob.
connector_io_tasks_per_scan_operator = 32

# NOT SET, deliberately -- pipeline_exec_thread_pool_thread_num (default 0, config.h:889).
# 0 means "use CpuInfo::num_cores()" (exec_env.cpp:663-666), which is now the correct 72
# because num_cores is set above. Same for pipeline_prepare_thread_pool_thread_num
# (config.h:894) and pipeline_sink_io_thread_pool_thread_num (config.h:897).

#####################################################################
## Ports -- UNCHANGED. Must match the staged $HOME/starrocks-bench/be1 tree
## and the `ALTER SYSTEM ADD BACKEND "127.0.0.1:9050"` registration.
#####################################################################
be_port = 9060
heartbeat_service_port = 9050
brpc_port = 8060
be_http_port = 8040
starlet_port = 9070

# CHANGED from the default 20001 (config.h:243, "StarRocks test backend").
# The committed setup script never assigns this, so every BE on the host inherits 20001 and
# they collide. Harmless if the port is never bound, necessary if it is -- cheap insurance.
port = 20001

#####################################################################
## Storage / spill / logs -- all moved OFF NFS
#####################################################################
# $HOME/starrocks-bench is NFS (master:/home). With the default ${STARROCKS_HOME}/... paths,
# tablet storage, the datacache disk tier, spill scratch and every log file go over NFS.
# This is the single largest avoidable handicap on engine B and would make the A/B
# comparison measure the filesystem instead of the engine.
#   /raid   = ext4 on /dev/md0, 14T (13T free), LOCAL
#   /       = ext4 on nvme1n1p3, LOCAL
#   /home   = nfs4                             <- avoid
#   /scratch= gpfs   (source parquet lives here, read-only)

# CHANGED from ${STARROCKS_HOME}/storage.
storage_root_path = /raid/prestouser/sr-bench/be1/storage

# CHANGED from ${STARROCKS_HOME}/spill (config.h:1242).
spill_local_storage_dir = /raid/prestouser/sr-bench/be1/spill

# CHANGED from ${STARROCKS_HOME}/log.
sys_log_dir = /raid/prestouser/sr-bench/be1/log

# UNCHANGED.
sys_log_level = INFO

#####################################################################
## Restored from the stock 3.5.20 be.conf
#####################################################################
# The committed setup-engine-b.sh heredoc is a `cat >` that overwrites the shipped be.conf
# wholesale, dropping this. It is required for JDK17 (Java UDFs and iceberg metadata).
JAVA_OPTS="--add-opens=java.base/java.util=ALL-UNNAMED --add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/sun.nio.ch=ALL-UNNAMED"

#####################################################################
## Deliberately NOT changed, and why (these are the common misdirections)
#####################################################################
#   scanner_thread_pool_thread_num = 48 (config.h:238)
#       Sizes the "table_scan_io" PriorityThreadPool (exec_env.cpp:577-579), the NON-pipeline
#       scan path. The pipeline engine is on by default, so this pool is inert here.
#   num_threads_per_core = 3 (config.h:216)
#       Dead code. Grepping 3.5.20's be/src for it returns only the definition -- zero consumers.
#   vector_chunk_size = 4096 (config.h:802)
#       Well tuned. Raising it inflates per-operator memory by DOP x pipeline count.
#   query_cache_capacity / enable_query_cache (config.h:1437, SessionVariable:2205)
#       Off by default and only applies to per-tablet native scans, not FILES().
#   load_process_max_memory_limit_percent = 30 (config.h:613)
#       There is no load path in this benchmark.
#   query_max_memory_limit_percent = 90 (config.h:607)
#       Fine as-is; it is a fraction of the process tracker, which is now correctly sized.
#
# FE-side, for the record: pipeline_dop is a SESSION variable, not a be.conf key. It resolves
# to min(max_pipeline_dop=64, avgNumCoresOfBe/2) (SessionVariable.java:3331-3339). With
# num_cores=72 reported that is a coherent 36 per fragment instance x 2 BEs = 72 concurrent
# drivers on 144 cores. Before the num_cores fix the BEs reported 144 -> 72 -> clamped to 64,
# which is both wrong and silently capped.
