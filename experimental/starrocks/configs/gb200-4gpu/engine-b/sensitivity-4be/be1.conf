# Engine B -- 4-BE SENSITIVITY VARIANT, BE1. *** NOT THE HEADLINE CONFIG. ***
#
# The recommended engine-B topology is 2 BEs (../be1.conf, ../be2.conf), one per Grace
# socket. This 4-BE variant exists only to answer "does BE count matter?" -- it is a
# sensitivity check, not the number to publish. Rationale in ../README.md.
#
# Half-socket partition: BE1 and BE3 share NUMA node 0; BE2 and BE4 share NUMA node 1.
# `--numa N` CANNOT express a half node (it always cpubinds the whole node), so this variant
# must be launched with an EXPLICIT numactl wrapper:
#
#   numactl --physcpubind=0-35 --membind=0 -- $HOME/starrocks-bench/be1/bin/start_be.sh --daemon
#
# Affinity and NUMA mempolicy are inherited across the fork/exec that --daemon performs.
# *** --membind may ONLY ever be 0 or 1. *** Nodes 2/10/18/26 are GPU HBM with zero CPUs.

priority_networks = 127.0.0.1/32

# CHANGED from "90%". Half of the 2-BE value so the per-socket total is unchanged:
# 2 BEs/socket x 120 GiB = 240 GiB/socket, exactly matching the 2-BE topology's 240 GiB/socket.
# Global: 4 x 120 = 480 GiB; 956.82 - 84 (fixed) - 480 = 392.82 GiB page cache, identical to
# the 2-BE case. Never a percentage -- MemTotal counts GPU HBM (see ../be1.conf).
# For SF1000 use 112G here (4 x 112 = 448, matching the 2-BE 2 x 224).
mem_limit = 120G

disable_storage_page_cache = true

# CHANGED from "0". Halved vs the 2-BE config so the per-socket cache total is unchanged
# (2 x 16 GiB = 32 GiB per socket). Note the SF100 dataset is now cached twice per socket,
# once per BE -- one of the real costs of sharding further, and part of what this test measures.
datacache_mem_size = 16G
datacache_disk_size = 0

# CHANGED from 0. 36, not 72: four BEs on 144 cores, and CpuInfo ignores the affinity mask
# (cpu_info.cpp:150-152,165-166), so without this each BE reports 144 and the FE sees 576
# cores on a 144-core box.
num_cores = 36

# CHANGED from true. get_core_ids() enumerates all 144 cores regardless of the cpuset.
enable_resource_group_bind_cpus = false

# CHANGED from 8. 4 x 36 = 144 threads/BE x 4 BEs = 576 total, identical to the 2-BE config.
pipeline_connector_scan_thread_num_per_cpu = 4

connector_io_tasks_per_scan_operator = 32

# Ports -- UNCHANGED from the 2-BE layout for BE1.
be_port = 9060
heartbeat_service_port = 9050
brpc_port = 8060
be_http_port = 8040
starlet_port = 9070
port = 20001

storage_root_path = /raid/prestouser/sr-bench/be1/storage
spill_local_storage_dir = /raid/prestouser/sr-bench/be1/spill
sys_log_dir = /raid/prestouser/sr-bench/be1/log
sys_log_level = INFO

JAVA_OPTS="--add-opens=java.base/java.util=ALL-UNNAMED --add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/sun.nio.ch=ALL-UNNAMED"
