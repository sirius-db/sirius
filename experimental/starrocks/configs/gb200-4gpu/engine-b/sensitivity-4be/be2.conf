# Engine B -- 4-BE SENSITIVITY VARIANT, BE2. *** NOT THE HEADLINE CONFIG. ***
# See ./be1.conf for the full annotations; only ports, paths and the pinning differ.
#
# BE2 shares NUMA node 1 with BE4, taking CPUs 72-107.
#   numactl --physcpubind=72-107 --membind=1 -- $HOME/starrocks-bench/be2/bin/start_be.sh --daemon
# *** --membind may ONLY ever be 0 or 1. *** Nodes 2/10/18/26 are GPU HBM with zero CPUs.

priority_networks = 127.0.0.1/32

# CHANGED from "90%". Half the 2-BE value; per-socket total unchanged at 240 GiB.
# Never a percentage -- /proc/meminfo MemTotal counts GPU HBM. SF1000: use 112G.
mem_limit = 120G

disable_storage_page_cache = true
datacache_mem_size = 16G
datacache_disk_size = 0

# CHANGED from 0. Four BEs on 144 cores; CpuInfo ignores the affinity mask.
num_cores = 36
enable_resource_group_bind_cpus = false
pipeline_connector_scan_thread_num_per_cpu = 4
connector_io_tasks_per_scan_operator = 32

# Ports -- UNCHANGED from the 2-BE layout for BE2 (+2 ladder from BE1).
be_port = 9062
heartbeat_service_port = 9052
brpc_port = 8062
be_http_port = 8042
starlet_port = 9072
port = 20002

storage_root_path = /raid/prestouser/sr-bench/be2/storage
spill_local_storage_dir = /raid/prestouser/sr-bench/be2/spill
sys_log_dir = /raid/prestouser/sr-bench/be2/log
sys_log_level = INFO

JAVA_OPTS="--add-opens=java.base/java.util=ALL-UNNAMED --add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/sun.nio.ch=ALL-UNNAMED"
