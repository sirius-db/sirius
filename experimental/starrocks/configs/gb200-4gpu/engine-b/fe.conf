# Engine B (stock StarRocks 3.5.20) FE config, re-baselined for the 4x GB200 Grace box.
#
# Copy target: $HOME/starrocks-bench/fe/conf/fe.conf
#
# The FE is a COORDINATOR ONLY. It parses SQL, runs the CBO, enumerates FILES() splits and
# ships fragments; it never holds query data. It is deliberately NOT sized like a worker --
# every GiB given to this JVM comes out of the same ~980 GB LPDDR pool the two BEs and the
# kernel page cache are competing for. See README.md "Memory arithmetic".
#
# Format note: uppercase keys are exported as shell vars by bin/start_fe.sh
# (via export_env_from_conf, start_fe.sh:72); lowercase keys are parsed by the Java
# Config class. LOG_DIR must be defined BEFORE JAVA_OPTS because JAVA_OPTS expands it.

#####################################################################
## Uppercase: read and exported by bin/start_fe.sh
#####################################################################

# CHANGED from default (${STARROCKS_HOME}/log).
# $HOME/starrocks-bench is on NFS (master:/home). The FE writes fe.out, the GC log and
# hs_err files here on the synchronous path. NFS also runs ~0.2 s ahead of the local clock
# on this box, which corrupts log ordering. /raid is local ext4 on /dev/md0 (14T, 13T free).
LOG_DIR = /raid/prestouser/sr-bench/fe/log

DATE = "$(date +%Y%m%d-%H%M%S)"

# CHANGED from default.
# The committed benchmarks/tpch/setup-engine-b.sh heredoc drops JAVA_OPTS entirely, which
# silently falls through to the hardcoded fallback at start_fe.sh:124 --
#   -Dlog4j2.formatMsgNoLookups=true -Xmx8192m -XX:+UseG1GC -Xlog:gc*:... -Djava.security.policy=...
# That fallback is 8 GiB AND it loses -XX:ErrorFile, so a JVM crash leaves no hs_err report.
#
# -Xmx16g (up from the 8g fallback / 8g stock): 8 GiB is thin for FE-side split enumeration
# over FILES() at SF1000 (the FE materializes the split list for every scan node before
# dispatch). 16 GiB is 2x that headroom. It is deliberately NOT 32g: this is a coordinator,
# and 32g would take another 16 GiB from the BE/page-cache budget for capacity that only
# split enumeration could ever touch. If the FE OOMs or GC-thrashes during SF1000 planning,
# raise to -Xmx24g and subtract 4G from each BE's mem_limit to stay inside the budget.
#
# Do NOT rely on FE_ENABLE_AUTO_JVM_XMX_DETECT here. It is a no-op off-container
# (bin/common.sh:118-120 requires /.dockerenv, and there is no Docker on this box), and even
# if it ran it derives the heap from /proc/meminfo MemTotal = 1692.6 GiB, which counts the
# four GPU HBM NUMA nodes. That is the same HBM trap that makes a percentage mem_limit
# unusable on the BE side -- see be1.conf.
JAVA_OPTS="-Dlog4j2.formatMsgNoLookups=true -Xmx16g -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError -Xlog:gc*:${LOG_DIR}/fe.gc.log.$DATE:time -XX:ErrorFile=${LOG_DIR}/hs_err_pid%p.log -Djava.security.policy=${STARROCKS_HOME}/conf/udf_security.policy"

#####################################################################
## Lowercase: read by the Java main program
#####################################################################

# UNCHANGED from the existing engine-B layout. Keeps the FE on loopback so it advertises
# 127.0.0.1, matching the BEs' priority_networks and the ALTER SYSTEM ADD BACKEND addresses.
priority_networks = 127.0.0.1/32

# UNCHANGED port block -- these are exactly the ports the current staged layout uses, and
# exactly the ports engine A's FE also binds.
#
#   *** 9030 IS SHARED WITH ENGINE A. THE TWO ENGINES CAN NEVER RUN AT THE SAME TIME. ***
#
# Engine A's FE is a DIFFERENT tree (experimental/starrocks/starrocks/output/fe), so these
# files do not collide -- only the ports and the host CPUs do. See README.md.
http_port = 8030
rpc_port = 9020
query_port = 9030
edit_log_port = 9010

# CHANGED from ${STARROCKS_HOME}/meta (which is NFS).
# meta_dir holds the BDB JE journal, which fsyncs on every edit-log write. BDB JE over NFS,
# with a ~0.2 s clock skew, is the worst placement available on this box. Moved to local ext4.
#
# *** CHANGING meta_dir BOOTSTRAPS A BRAND NEW, EMPTY FE CLUSTER. ***
# The BEs registered against the old $HOME/starrocks-bench/fe/meta are NOT carried over.
# After the first start with this conf you must re-run the ALTER SYSTEM ADD BACKEND
# statements that setup-engine-b-gb200.sh prints. This is a one-time cost.
meta_dir = /raid/prestouser/sr-bench/fe/meta

# CHANGED from ${STARROCKS_HOME}/log. These are separate Config.java keys from the shell
# LOG_DIR above -- setting LOG_DIR alone still leaves fe.log/fe.audit.log on NFS.
sys_log_dir = /raid/prestouser/sr-bench/fe/log
audit_log_dir = /raid/prestouser/sr-bench/fe/log

# UNCHANGED. INFO is what the committed setup script uses; keep it so A/B logging is comparable.
sys_log_level = INFO

# CHANGED: restored from the stock 3.5.20 fe.conf. The committed setup-engine-b.sh heredoc
# is a `cat >` that overwrites the shipped file wholesale, silently dropping this key and
# reverting to the Config.java compiled default.
mysql_service_nio_enabled = true

# NOT SET, deliberately -- run_mode defaults to `shared_nothing`, which is what engine B needs.
#
# Engine A's FE conf sets `run_mode = shared_data` + `enable_load_volume_from_conf = false`
# because its storage-less Rust CNs are only schedulable in shared-data mode. Engine B runs
# real BEs. DO NOT copy engine A's run_mode over here: in shared_data mode a BE-backed
# cluster will not schedule FILES() scans the way the baseline expects.

# NOT SET, deliberately -- default_replication_num. Engine A pins it to 1 for its internal
# tables. Engine B's benchmark reads external parquet through FILES() and creates no
# replicated user tables (REPRODUCE.md: "there is no loading step"), so the default is inert.

# NOT CHANGED, for the record, and why:
#   qe_max_connection = 4096            -- a single-client benchmark never approaches this.
#   thrift_server_max_worker_threads = 4096
#   enable_statistic_collect = true     -- leave ON. The CBO needs stats to produce sane
#                                          plans; disabling it would handicap engine B and
#                                          make the A/B comparison dishonest.
#   max_query_retry_time = 2            -- NOTE: a hung query is retried up to 3x, which
#                                          inflates wall-clock in bench.sh. Leave it at the
#                                          default so B gets stock behavior, but read any
#                                          outlier timing with this in mind.
