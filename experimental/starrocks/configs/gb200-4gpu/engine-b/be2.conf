# Engine B (stock StarRocks 3.5.20) BE2 config -- 4x GB200 Grace box, 2-BE topology.
#
# Copy target: $HOME/starrocks-bench/be2/conf/be.conf
# Launch:      $HOME/starrocks-bench/be2/bin/start_be.sh --daemon --numa 1
#              (start_backend.sh:134-136 turns --numa 1 into
#               `numactl --cpubind 1 --membind 1`, wrapped around the BE binary itself)
#
# BE2 owns NUMA node 1: CPUs 72-143, 489,823 MiB (478.34 GiB) of LPDDR.
#
# *** ONLY --numa 0 AND --numa 1 ARE EVER VALID ON THIS BOX. ***
# numactl nodes 2, 10, 18 and 26 are GPU HBM (188,416 MiB each, ZERO CPUs). RUN_NUMA is
# substituted into BOTH --cpubind and --membind (start_backend.sh:136).
#
# This file is identical to be1.conf except for the ports and the three /raid paths.
# The full reasoning for every value lives in be1.conf -- it is summarized here.

# UNCHANGED. Loopback, matching the FE and the ADD BACKEND address.
priority_networks = 127.0.0.1/32

#####################################################################
## Memory
#####################################################################

# CHANGED from the default "90%" (config.h:84).
# *** NEVER USE A PERCENTAGE ON THIS BOX. *** /proc/meminfo MemTotal reads 1692.6 GiB because
# the kernel counts the four 184 GiB GPU HBM NUMA nodes; only 956.82 GiB is real LPDDR. The
# stock "90%" resolves to ~1523 GiB per BE on a Swap: 0 box = guaranteed OOM-kill.
# 240G is the SF100 number: 956.82 - 84 (fixed tenants) - 2*240 = 392.82 GiB of page cache
# (= 402.2 "GB" in the MiB/1000 unit the box brief uses), which clears the OPEN-ISSUES M1
# item 3 ">=400 GB for page cache" bar and is 15x the 26 GiB dataset.
# Per-node check (478.34 GiB on node 1, no FE here):
#   478.34 - 240 - ~25 (mmfsd share) - ~5 (kernel) = ~208 GiB slack under the HARD membind
# (a membind overrun is an OOM-kill, not a fallback to the other socket).
# *** SF1000: change to 224G on BOTH BEs. *** See README.md.
mem_limit = 240G

# CHANGED from false (config.h:306). No native OLAP tables exist in this benchmark -- both
# engines read parquet via FILES() -- so this cache can never fill, yet reserves 20% of the
# process tracker (~64 GiB) by default.
disable_storage_page_cache = true

# CHANGED from "0" (config.h:1297). This is the cache FILES() actually uses. It is enabled by
# default but sized zero, and auto-adjust only grows the disk quota after 7200 s of disk idle
# (config.h:1353), so stock 3.5.20 caches nothing within a benchmark run. Comes out of
# mem_limit, so it is not double-counted.
datacache_mem_size = 32G

# CHANGED from "0" -> set explicitly to 0 to pin behavior instead of leaving it to
# auto-adjust. Set to 200G for SF1000 (it lives under storage_root_path = local RAID).
datacache_disk_size = 0

#####################################################################
## CPU / thread pools -- sized for 72 cores, not 144
#####################################################################

# CHANGED from 0 (config.h:574). MANDATORY with --numa: CpuInfo never calls
# sched_getaffinity (cpu_info.cpp:150-152, 165-166), so numactl --cpubind does NOT shrink the
# detected core count. cpu_info.cpp:173 is the only override.
num_cores = 72

# CHANGED from true (config.h:1514). CpuInfo::get_core_ids() enumerates all 144 cores
# regardless of the cpuset, so the BE would try to bind threads outside its own cpubind mask.
enable_resource_group_bind_cpus = false

# CHANGED from 8 (config.h:885). Sizes the connector scan pool (ceil(v * num_cores)) that
# FILES() uses: 8*72 = 576/BE (1152 total) -> 4*72 = 288/BE (576 total) on 144 cores.
pipeline_connector_scan_thread_num_per_cpu = 4

# CHANGED from 16 (config.h:1035). GPFS rewards deep IO queues; this is an adaptive ceiling,
# not a floor (config.h:1036-1041). Primary sweep knob.
connector_io_tasks_per_scan_operator = 32

#####################################################################
## Ports -- UNCHANGED, +2 from BE1. Must match the staged be2 tree and
## `ALTER SYSTEM ADD BACKEND "127.0.0.1:9052"`.
#####################################################################
be_port = 9062
heartbeat_service_port = 9052
brpc_port = 8062
be_http_port = 8042
starlet_port = 9072

# CHANGED from 20001 (config.h:243). The committed setup script never assigns this, so every
# BE on the host inherits 20001 and they collide.
port = 20002

#####################################################################
## Storage / spill / logs -- all moved OFF NFS ($HOME is nfs4) onto local ext4 RAID
#####################################################################
storage_root_path = /raid/prestouser/sr-bench/be2/storage
spill_local_storage_dir = /raid/prestouser/sr-bench/be2/spill
sys_log_dir = /raid/prestouser/sr-bench/be2/log

# UNCHANGED.
sys_log_level = INFO

# CHANGED: restored from the stock 3.5.20 be.conf, which the committed setup script's
# `cat >` heredoc overwrites away. Required for JDK17 (Java UDFs, iceberg metadata).
JAVA_OPTS="--add-opens=java.base/java.util=ALL-UNNAMED --add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/sun.nio.ch=ALL-UNNAMED"

# Deliberately NOT changed: scanner_thread_pool_thread_num (non-pipeline path, inert),
# num_threads_per_core (dead code in 3.5.20), vector_chunk_size (well tuned),
# query_cache_* (native-table only), load_process_max_memory_limit_percent (no load path).
# See be1.conf for the full annotated list.
