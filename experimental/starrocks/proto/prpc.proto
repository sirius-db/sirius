syntax = "proto2";

package prpc;

// Minimal Baidu PRPC envelope metadata used by the StarRocks FE when it calls
// PInternalService over BRPC. The protobuf request body and thrift attachment
// are framed outside this metadata by the 12-byte PRPC TCP header.
message RpcMeta {
  optional RpcRequestMeta request = 1;
  optional RpcResponseMeta response = 2;
  optional int32 compress_type = 3;
  optional int64 correlation_id = 4;
  optional int32 attachment_size = 5;
  optional ChunkInfo chunk_info = 6;
  optional bytes authentication_data = 7;
}

message RpcRequestMeta {
  required string service_name = 1;
  required string method_name = 2;
  optional int64 log_id = 3;
  optional int64 trace_id = 4;
  optional int64 span_id = 5;
  optional int64 parent_span_id = 6;
  repeated RpcRequestMetaExtField ext_fields = 7;
  optional bytes extra_param = 110;
  optional string trace_key = 111;
}

message RpcRequestMetaExtField {
  required string key = 1;
  required string value = 2;
}

message RpcResponseMeta {
  optional int32 error_code = 1;
  optional string error_text = 2;
}

message ChunkInfo {
  required int64 stream_id = 1;
  required int64 chunk_id = 2;
}
