#####################################################################
## The uppercase properties are read and exported by bin/start_fe.sh.
## To see all Frontend configurations,
## see fe/fe-core/src/main/java/com/starrocks/common/Config.java

# the output dir of stderr/stdout/gc
LOG_DIR = ${STARROCKS_HOME}/log

DATE = "$(date +%Y%m%d-%H%M%S)"
JAVA_OPTS="-Dlog4j2.formatMsgNoLookups=true -Xmx8192m -XX:+UseG1GC -Xlog:gc*:${LOG_DIR}/fe.gc.log.$DATE:time -XX:ErrorFile=${LOG_DIR}/hs_err_pid%p.log -Djava.security.policy=${STARROCKS_HOME}/conf/udf_security.policy"

##
## the lowercase properties are read by main program.
##

# DEBUG, INFO, WARN, ERROR, FATAL
sys_log_level = INFO

# store metadata, create it if it is not exist.
# Default value is ${STARROCKS_HOME}/meta
# meta_dir = ${STARROCKS_HOME}/meta

http_port = 8030
rpc_port = 9020
query_port = 9030
edit_log_port = 9010

# Enable jaeger tracing by setting jaeger_grpc_endpoint
# jaeger_grpc_endpoint = http://localhost:14250

# Choose one if there are more than one ip except loopback address.
# Note that there should at most one ip match this list.
# If no ip match this rule, will choose one randomly.
# use CIDR format, e.g. 10.10.10.0/24
# Default value is empty.
# priority_networks = 10.10.10.0/24;192.168.0.0/16

# Advanced configurations
# log_roll_size_mb = 1024
# sys_log_dir = ${STARROCKS_HOME}/log
# sys_log_roll_num = 10
# sys_log_verbose_modules =
# audit_log_dir = ${STARROCKS_HOME}/log
# audit_log_modules = slow_query, query
# audit_log_roll_num = 10
# meta_delay_toleration_second = 10
# qe_max_connection = 1024
# max_conn_per_user = 100
# qe_query_timeout_second = 300
# qe_slow_log_ms = 5000

# Sirius local FE overrides. The Rust compute node only supports FE/CN
# liveness today, so keep replicated FE-internal table maintenance quiet
# until storage and disk reporting support are implemented.
default_replication_num = 1
table_keeper_interval_second = 86400

# Control-LAN CIDR: 10.87.140.32/27 covers .32-.63, so the FE advertises its bond0 address
# (gcn-17 = 10.87.140.52) instead of loopback and remote CNs can reach it. The FE breaks on the
# first local address inside the CIDR, and there is exactly one per host.
#
# The CN's --fe-host default is still 127.0.0.1, so every CN must now pass
# --fe-host 10.87.140.52 explicitly.
#
# Changing this does NOT rewrite the identity already persisted in meta/image/ROLE. If that file
# still names 127.0.0.1, the FE exits with "current node is not added to the cluster, will exit"
# -- see 2NODE-BRINGUP-PLAN.md Task 1.1 step 3b before starting it.
priority_networks = 10.87.140.32/27

# Node-local metadata on ext4 (/dev/md0), NOT the default $STARROCKS_HOME/meta -- that path is
# under /home, which is NFS (master:/home), and BDB JE fsyncs on every edit-log write.
#
# This is ALSO the resolution of the identity problem described above: a fresh meta_dir bootstraps
# a new cluster whose ROLE records the routable address, instead of inheriting
# `name=127.0.0.1_9010_...` from the single-host era and exiting at startup. Nothing is lost --
# engine A creates no persistent tables (every query reads parquet through FILES()) -- but any
# FE-persisted session variable (e.g. enable_pipeline_engine) resets to its default, which is
# what a reproducible benchmark wants anyway.
meta_dir = /raid/prestouser/sr-eng-a-2node/fe/meta

# Shared-data so the storage-less CN serves queries (shared-nothing schedules only on BEs);
# enable_load_volume_from_conf=false lets the FE bootstrap with no object storage.
run_mode = shared_data
enable_load_volume_from_conf = false
