[workspace]
channels = ["rapidsai","conda-forge"]
name = "sirius-starrocks"
# CUDA-pinned platforms (pixi >=0.71): the `engine` feature links the CUDA 13
# Sirius build, so pin `__cuda` on the platforms (mirrors the repo-root
# pixi.toml). CPU-only hosts assert `CONDA_OVERRIDE_CUDA` to resolve.
platforms = [
  { name = "linux-64-cuda13", platform = "linux-64", cuda = "13" },
  { name = "linux-aarch64-cuda13", platform = "linux-aarch64", cuda = "13" },
]
requires-pixi = ">=0.71"

[environments]
default = ["fe","cn","client","engine"]
cn = ["cn"]
fe = ["fe"]
client = ["client"]
engine = ["engine"]

[tasks]
cluster = {cmd = """
bash -lc 'set -euo pipefail

cleanup() {
    status=$?
    trap - EXIT INT TERM
    kill "${fe_pid:-}" "${cn_pid:-}" 2>/dev/null || true
    wait "${fe_pid:-}" "${cn_pid:-}" 2>/dev/null || true
    exit "${status}"
}
trap cleanup EXIT INT TERM

starrocks/output/fe/bin/start_fe.sh --logconsole &
fe_pid="$!"

target/release/sirius-starrocks-cn &
cn_pid="$!"

wait -n "${fe_pid}" "${cn_pid}"
'
""",cwd = ".",depends-on = ["fe-check","cn-build"],description = "Run the local StarRocks FE and Rust CN in the foreground with logs",env = {LD_LIBRARY_PATH = "../../build/release/extension/sirius:/home/ubuntu/git/sirius-db/sirius-worktrees/tools/nvda_nixl/lib/x86_64-linux-gnu:/home/ubuntu/git/sirius-db/sirius-worktrees/tools/ucx-install/lib"}}

# Two CNs share one GPU: each carves out an 8GiB slice (reservation == usage limit in the
# derived config), so neither primes the default ~0.95x of device memory. CN2 shifts every
# listener port by +2 and keeps its engine artifacts in .cn2.
#
# Cross-node exchange rides the nixl tier: SIRIUS_EXCHANGE_STAGING_BYTES gives each CN a
# 1280MiB cudaMalloc exchange staging arena (512MiB starved TPC-H q09: one packed-table lease
# of 648MB exceeded the whole arena). NOTE: the arena sits OUTSIDE --gpu-memory-limit
# (PLAN-PATH-B D-B4) — each CN really occupies ~8GiB + 1.25GiB + CUDA context overhead, sized
# below to still fit two CNs on the 23GiB L4. UCX_TLS must include cuda_copy (VRAM detection;
# registration fails without it) and cuda_ipc (the fast same-host path the bandwidth canary
# demands).
cluster2 = {cmd = """
bash -lc 'set -euo pipefail

cleanup() {
    status=$?
    trap - EXIT INT TERM
    kill "${fe_pid:-}" "${cn1_pid:-}" "${cn2_pid:-}" 2>/dev/null || true
    wait "${fe_pid:-}" "${cn1_pid:-}" "${cn2_pid:-}" 2>/dev/null || true
    exit "${status}"
}
trap cleanup EXIT INT TERM

starrocks/output/fe/bin/start_fe.sh --logconsole &
fe_pid="$!"

target/release/sirius-starrocks-cn \
    --gpu-memory-limit 8GiB --host-memory-limit 12GiB --engine-dir .cn1 &
cn1_pid="$!"

target/release/sirius-starrocks-cn \
    --heartbeat-port 9052 --thrift-port 9062 --brpc-port 8062 --http-port 8042 \
    --starlet-port 9072 \
    --gpu-memory-limit 8GiB --host-memory-limit 12GiB --engine-dir .cn2 &
cn2_pid="$!"

wait -n "${fe_pid}" "${cn1_pid}" "${cn2_pid}"
'
""",cwd = ".",depends-on = ["fe-check","cn-build"],description = "Run the FE and two 8GiB-carve-out CNs sharing one GPU, cross-node exchange over nixl",env = {LD_LIBRARY_PATH = "../../build/release/extension/sirius:/home/ubuntu/git/sirius-db/sirius-worktrees/tools/nvda_nixl/lib/x86_64-linux-gnu:/home/ubuntu/git/sirius-db/sirius-worktrees/tools/ucx-install/lib",NIXL_PLUGIN_DIR = "/home/ubuntu/git/sirius-db/sirius-worktrees/tools/nvda_nixl/lib/x86_64-linux-gnu/plugins",UCX_TLS = "cuda_copy,cuda_ipc,tcp,self",SIRIUS_EXCHANGE_STAGING_BYTES = "1280MiB"}}

# This demo project ships the StarRocks FE pre-packaged under starrocks/output/fe, so `cluster`
# does not depend on `fe-build` (a multi-hour Maven build of the whole front end). Assert the
# package is there and point at `fe-build` if it is not.
fe-check = {cmd = """
bash -lc 'test -x starrocks/output/fe/bin/start_fe.sh || {
    echo "No packaged FE at starrocks/output/fe." >&2
    echo "Run: git submodule update --init --recursive experimental/starrocks/starrocks" >&2
    echo "then: pixi run fe-build   (long — builds the StarRocks front end from source)" >&2
    exit 1
}'
""",cwd = ".",description = "Assert the packaged StarRocks FE is present"}

[feature.client.dependencies]
# Provides the `mysql` CLI that speaks the FE's MySQL wire protocol on query_port.
mysql-client = "*"

[feature.client.tasks]
client = {cmd = "mysql --host 127.0.0.1 --port 9030 --user root",description = "Open a MySQL client against the local FE (run `cluster` in another terminal first)"}

[feature.cn.dependencies]
# Provides protoc for prost-build in the Substrait crates on fresh CN envs.
libprotobuf = ">=7.35,<8"
rust = "*"
thrift-compiler = "*"

[feature.cn.tasks]
# Build libsirius from source via the repo-root build (creates build/release, which
# sirius-sys links by default).
engine-build = {cmd = "pixi run --manifest-path pixi.toml make",cwd = "../..",description = "Build the Sirius engine (libsirius) from source for the CN to link"}

# Engine-linked CN (default `sirius-engine` + `nixl-transport` features); needs the engine
# artifact, the `engine` feature's toolchain/libs (in the default env), and the local libnixl
# install (NIXL_PREFIX). NIXL_NO_STUBS_FALLBACK=1 is mandatory: without it a broken nixl link
# silently degrades to a dlopen stub. BINDGEN_EXTRA_CLANG_ARGS points nixl-sys's bindgen at the
# repo pixi env's clang-21 builtin headers (the system libclang-18 ships none).
cn-build = {cmd = "cargo build --release -p sirius-starrocks-cn",depends-on = ["engine-build"],description = "Build the engine-linked StarRocks CN release binary",env = {CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER = "/usr/bin/gcc",NIXL_PREFIX = "/home/ubuntu/git/sirius-db/sirius-worktrees/tools/nvda_nixl",NIXL_NO_STUBS_FALLBACK = "1",BINDGEN_EXTRA_CLANG_ARGS = "-isystem /home/ubuntu/git/sirius-db/sirius-worktrees/integration/.pixi/envs/default/lib/clang/21/include"}}
cn-test = {cmd = "cargo test -p sirius-starrocks-cn",depends-on = ["engine-build"],description = "Run engine-linked StarRocks CN tests",env = {CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER = "/usr/bin/gcc",NIXL_PREFIX = "/home/ubuntu/git/sirius-db/sirius-worktrees/tools/nvda_nixl",NIXL_NO_STUBS_FALLBACK = "1",BINDGEN_EXTRA_CLANG_ARGS = "-isystem /home/ubuntu/git/sirius-db/sirius-worktrees/integration/.pixi/envs/default/lib/clang/21/include",NIXL_PLUGIN_DIR = "/home/ubuntu/git/sirius-db/sirius-worktrees/tools/nvda_nixl/lib/x86_64-linux-gnu/plugins",UCX_TLS = "cuda_copy,cuda_ipc,tcp,self",LD_LIBRARY_PATH = "../../build/release/extension/sirius:/home/ubuntu/git/sirius-db/sirius-worktrees/tools/nvda_nixl/lib/x86_64-linux-gnu:/home/ubuntu/git/sirius-db/sirius-worktrees/tools/ucx-install/lib"}}
cn-run = {cmd = "cargo run -p sirius-starrocks-cn --",depends-on = ["engine-build"],description = "Run the engine-linked StarRocks CN with local FE defaults",env = {CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER = "/usr/bin/gcc",NIXL_PREFIX = "/home/ubuntu/git/sirius-db/sirius-worktrees/tools/nvda_nixl",NIXL_NO_STUBS_FALLBACK = "1",BINDGEN_EXTRA_CLANG_ARGS = "-isystem /home/ubuntu/git/sirius-db/sirius-worktrees/integration/.pixi/envs/default/lib/clang/21/include",NIXL_PLUGIN_DIR = "/home/ubuntu/git/sirius-db/sirius-worktrees/tools/nvda_nixl/lib/x86_64-linux-gnu/plugins",UCX_TLS = "cuda_copy,cuda_ipc,tcp,self",LD_LIBRARY_PATH = "../../build/release/extension/sirius:/home/ubuntu/git/sirius-db/sirius-worktrees/tools/nvda_nixl/lib/x86_64-linux-gnu:/home/ubuntu/git/sirius-db/sirius-worktrees/tools/ucx-install/lib"}}

# Pure-Rust path (no engine, build tree, or GPU). What CI runs.
cn-test-no-engine = {cmd = "cargo test -p sirius-starrocks-cn --no-default-features",description = "Run Rust StarRocks CN tests without the embedded Sirius engine"}

# Toolchain + libs to compile and link the engine-linked CN, copied from the
# repo-root pixi.toml so this env can build/run it. Kept in sync with that file.
[feature.engine]
platforms = ["linux-64-cuda13", "linux-aarch64-cuda13"]

[feature.engine.dependencies]
cxx-compiler = "*"
cuda-version = "13.2.*"
libcudf = "26.06.*"
librmm = "*"
libcurand-dev = "*"
yaml-cpp = "*"
libabseil = "*"
duckdb = "=1.5.3"
spdlog = "1.8.*"
sqlite = "3.*"
liburing = "*"
openssl = "*"
libcurl = "*"

[feature.fe.dependencies]
bash = "*"
coreutils = "*"
findutils = "*"
gawk = "*"
gcc = ">=12.1"
git = "*"
grep = "*"
libprotobuf = "*"
make = "*"
maven = ">=3.9"
openjdk = "17.*"
python = "3.11.*"
sed = "*"
thrift-compiler = "0.20.*"
util-linux = "*"
which = "*"

[feature.fe.tasks]
fe-clean = {cmd = """
bash -lc 'set -e
rm -rf output/fe output/LICENSE.txt output/NOTICE.txt fe/*/target fe/plugin/*/target java-extensions/target java-extensions/hadoop-ext/target
rm -f fe/plugin/hive-udf/dependency-reduced-pom.xml fe/plugin/spark-dpp/dependency-reduced-pom.xml'
""",cwd = "starrocks",description = "Remove generated StarRocks FE build artifacts"}

fe-run = {cmd = "output/fe/bin/start_fe.sh --logconsole",cwd = "starrocks",depends-on = ["fe-build"],description = "Run the packaged StarRocks FE in the foreground"}

fe-build = {cmd = """
bash -lc 'set -e
notice_script="build-support/gen_notice.py"
notice_backup="$(mktemp)"
cp "$notice_script" "$notice_backup"
restore_notice() {
    status=$?
    trap - EXIT
    cp "$notice_backup" "$notice_script"
    rm -f "$notice_backup"
    exit "$status"
}
trap restore_notice EXIT
sed -i "1s|^.*$|#!/usr/bin/env python3|" "$notice_script"

thirdparty="${PIXI_PROJECT_ROOT}/.pixi/starrocks-fe-thirdparty"
mkdir -p "${thirdparty}/installed/llvm/lib"
touch "${thirdparty}/installed/llvm/lib/libLLVMInstCombine.a"
STARROCKS_THIRDPARTY="${thirdparty}" ./build.sh --fe --with-maven-batch-mode ON
cp ../conf/fe.conf output/fe/conf/fe.conf'
""",
cwd = "starrocks",inputs = [
    "conf/fe.conf",
    "starrocks/build.sh",
    "starrocks/env.sh",
    "starrocks/build-support/build_helpers.sh",
    "starrocks/build-support/gen_notice.py",
    "starrocks/bin/*_fe.sh",
    "starrocks/bin/show_fe_version.sh",
    "starrocks/bin/common.sh",
    "starrocks/conf/cluster_snapshot.yaml",
    "starrocks/conf/core-site.xml",
    "starrocks/conf/fe.conf",
    "starrocks/conf/hadoop_env.sh",
    "starrocks/conf/udf_security.policy",
    "starrocks/fe/checkstyle.xml",
    "starrocks/fe/pom.xml",
    "starrocks/fe/*/pom.xml",
    "starrocks/fe/*/src/**/*",
    "starrocks/fe/plugin/*/pom.xml",
    "starrocks/fe/plugin/*/src/**/*",
    "starrocks/gensrc/Makefile",
    "starrocks/gensrc/proto/**/*",
    "starrocks/gensrc/script/**/*",
    "starrocks/gensrc/thrift/**/*",
    "starrocks/java-extensions/pom.xml",
    "starrocks/java-extensions/hadoop-ext/pom.xml",
    "starrocks/java-extensions/hadoop-ext/src/**/*",
    "starrocks/webroot/**/*",
    "starrocks/LICENSE.txt",
    "starrocks/licenses/**/*",
    "starrocks/licenses-binary/**/*",
],outputs = [
    "starrocks/output/LICENSE.txt",
    "starrocks/output/NOTICE.txt",
    "starrocks/output/fe/bin/*.sh",
    "starrocks/output/fe/conf/*",
    "starrocks/output/fe/hive-udf/*.jar",
    "starrocks/output/fe/lib/*.jar",
    "starrocks/output/fe/spark-dpp/*.jar",
    "starrocks/output/fe/webroot/**/*",
],description = "Build and package the StarRocks FE into starrocks/output/fe"}
