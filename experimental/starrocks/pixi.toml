[workspace]
channels = ["rapidsai","conda-forge"]
name = "sirius-starrocks"
platforms = ["linux-64","linux-aarch64"]

[environments]
fe = ["fe"]

[feature.fe.dependencies]
bash = "*"
coreutils = "*"
findutils = "*"
gawk = "*"
gcc = ">=12.1"
git = "*"
grep = "*"
libprotobuf = "*"
make = "*"
maven = ">=3.9"
openjdk = "17.*"
python = "3.11.*"
sed = "*"
thrift-compiler = "*"
util-linux = "*"
which = "*"

[feature.fe.tasks]
fe-clean = {cmd = """
bash -lc 'set -e
rm -rf output/fe output/LICENSE.txt output/NOTICE.txt fe/*/target fe/plugin/*/target java-extensions/target java-extensions/hadoop-ext/target
rm -f fe/plugin/hive-udf/dependency-reduced-pom.xml fe/plugin/spark-dpp/dependency-reduced-pom.xml'
""",cwd = "starrocks",description = "Remove generated StarRocks FE build artifacts"}

fe-run = {cmd = "output/fe/bin/start_fe.sh --logconsole",cwd = "starrocks",depends-on = ["fe-build"],description = "Run the packaged StarRocks FE in the foreground"}

fe-build = {cmd = """
bash -lc 'set -e
notice_script="build-support/gen_notice.py"
notice_backup="$(mktemp)"
cp "$notice_script" "$notice_backup"
restore_notice() {
    status=$?
    trap - EXIT
    cp "$notice_backup" "$notice_script"
    rm -f "$notice_backup"
    exit "$status"
}
trap restore_notice EXIT
sed -i "1s|^.*$|#!/usr/bin/env python3|" "$notice_script"

thirdparty="${PIXI_PROJECT_ROOT}/.pixi/starrocks-fe-thirdparty"
mkdir -p "${thirdparty}/installed/llvm/lib"
touch "${thirdparty}/installed/llvm/lib/libLLVMInstCombine.a"
STARROCKS_THIRDPARTY="${thirdparty}" ./build.sh --fe --with-maven-batch-mode ON'
""",
cwd = "starrocks",inputs = [
    "starrocks/build.sh",
    "starrocks/env.sh",
    "starrocks/build-support/build_helpers.sh",
    "starrocks/build-support/gen_notice.py",
    "starrocks/bin/*_fe.sh",
    "starrocks/bin/show_fe_version.sh",
    "starrocks/bin/common.sh",
    "starrocks/conf/cluster_snapshot.yaml",
    "starrocks/conf/core-site.xml",
    "starrocks/conf/fe.conf",
    "starrocks/conf/hadoop_env.sh",
    "starrocks/conf/udf_security.policy",
    "starrocks/fe/checkstyle.xml",
    "starrocks/fe/pom.xml",
    "starrocks/fe/*/pom.xml",
    "starrocks/fe/*/src/**/*",
    "starrocks/fe/plugin/*/pom.xml",
    "starrocks/fe/plugin/*/src/**/*",
    "starrocks/gensrc/Makefile",
    "starrocks/gensrc/proto/**/*",
    "starrocks/gensrc/script/**/*",
    "starrocks/gensrc/thrift/**/*",
    "starrocks/java-extensions/pom.xml",
    "starrocks/java-extensions/hadoop-ext/pom.xml",
    "starrocks/java-extensions/hadoop-ext/src/**/*",
    "starrocks/webroot/**/*",
    "starrocks/LICENSE.txt",
    "starrocks/licenses/**/*",
    "starrocks/licenses-binary/**/*",
],outputs = [
    "starrocks/output/LICENSE.txt",
    "starrocks/output/NOTICE.txt",
    "starrocks/output/fe/bin/*.sh",
    "starrocks/output/fe/conf/*",
    "starrocks/output/fe/hive-udf/*.jar",
    "starrocks/output/fe/lib/*.jar",
    "starrocks/output/fe/spark-dpp/*.jar",
    "starrocks/output/fe/webroot/**/*",
],description = "Build and package the StarRocks FE into starrocks/output/fe"}
