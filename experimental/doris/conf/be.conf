# Doris BE configuration for the benchmark's native reference (plan-doc
# experiments/sf10-bench: system A). Copied over the official BE's own conf/be.conf by
# scripts/be-native.sh, which fills the @@...@@ placeholders. Uppercase keys are exported by
# bin/start_be.sh; everything else is BE config (be/src/common/config.cpp).
#
# Stock 4.1.4 values except: ports moved off the stock BE ports (the Sirius backend from this
# directory registers with the same FE on 9050/9060/8040/8060), loopback-only networking,
# mem_limit sized by be-native.sh, and user_files_secure_path opened up so local() can glob
# the parquet dataset outside the BE's own directory. No tuning of the execution engine.

CUR_DATE=`date +%Y%m%d-%H%M%S`

# Log dir
LOG_DIR="${DORIS_HOME}/log/"

# For jdk 17, this JAVA_OPTS will be used as default JVM options (stock 4.1.4).
JAVA_OPTS_FOR_JDK_17="-Dfile.encoding=UTF-8 -Djol.skipHotspotSAAttach=true -Xmx2048m -DlogPath=$LOG_DIR/jni.log -Xlog:gc*:$LOG_DIR/be.gc.log.$CUR_DATE:time,uptime:filecount=10,filesize=50M -Djavax.security.auth.useSubjectCredsOnly=false -Dsun.security.krb5.debug=true -Dsun.java.command=DorisBE -XX:-CriticalJNINatives -XX:+IgnoreUnrecognizedVMOptions -Darrow.enable_null_check_for_get=false --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.lang.invoke=ALL-UNNAMED --add-opens=java.base/java.lang.reflect=ALL-UNNAMED --add-opens=java.base/java.io=ALL-UNNAMED --add-opens=java.base/java.net=ALL-UNNAMED --add-opens=java.base/java.nio=org.apache.arrow.memory.core,ALL-UNNAMED --add-opens=java.base/java.util=ALL-UNNAMED --add-opens=java.base/java.util.concurrent=ALL-UNNAMED --add-opens=java.base/java.util.concurrent.atomic=ALL-UNNAMED --add-opens=java.base/sun.nio.ch=ALL-UNNAMED --add-opens=java.base/sun.nio.cs=ALL-UNNAMED --add-opens=java.base/sun.security.action=ALL-UNNAMED --add-opens=java.base/sun.util.calendar=ALL-UNNAMED --add-opens=java.security.jgss/sun.security.krb5=ALL-UNNAMED --add-opens=java.management/sun.management=ALL-UNNAMED --add-opens=java.base/jdk.internal.ref=ALL-UNNAMED --add-opens=java.xml/com.sun.org.apache.xerces.internal.jaxp=ALL-UNNAMED"

# JDK 17 from the `fe` pixi environment (be-native.sh exports it; start_be.sh needs it set).
JAVA_HOME=@@JAVA_HOME@@

JEMALLOC_CONF="percpu_arena:percpu,background_thread:true,metadata_thp:auto,muzzy_decay_ms:5000,dirty_decay_ms:5000,oversize_threshold:0,prof:true,prof_active:false,lg_prof_interval:-1,lg_extent_max_active_fit:8"
JEMALLOC_PROF_PRFIX="jemalloc_heap_profile_"

# Stock ports + 100: the Sirius backend holds 9050/9060/8040/8060 on the same host. Both
# backends stay registered with the FE; the benchmark runs one at a time (plan §6.2).
be_port = 9160
webserver_port = 8140
heartbeat_service_port = 9150
brpc_port = 8160
arrow_flight_sql_port = -1

enable_https = false
ssl_certificate_path = "$DORIS_HOME/conf/cert.pem"
ssl_private_key_path = "$DORIS_HOME/conf/key.pem"

# Loopback, like the FE (conf/fe.conf): the BE must advertise the address it is registered
# under, or it rejects the FE's heartbeat.
priority_networks = 127.0.0.0/8

# Process memory limit (default 90% of RAM); be-native.sh sizes it for a host shared with the
# FE. Actual TPC-H SF10 usage is far below it.
mem_limit = @@MEM_LIMIT@@

# OLAP storage: only used by the optional internal-table reference (system C); the parquet
# systems never write here. be-native.sh points it at the local NVMe when there is one.
storage_root_path = @@STORAGE_ROOT@@

# local() globs relative to this prefix (io/fs/local_file_system.cpp safe_glob); the stock
# value ${DORIS_HOME} would hide the dataset. The FE only ever sends the benchmark's paths.
user_files_secure_path = /

sys_log_level = INFO
aws_log_level = 2
azure_log_level = 4
AWS_EC2_METADATA_DISABLED=true
