# Doris FE configuration for a single-node Sirius cluster: one official-binary FE on
# loopback plus the Rust backend(s) from this directory. Copied over the FE's own
# conf/fe.conf by scripts/fe.sh. Uppercase keys are exported by bin/start_fe.sh.

CUR_DATE=`date +%Y%m%d-%H%M%S`
LOG_DIR = ${DORIS_HOME}/log

# JDK 17 (what the `fe` pixi environment provides). The stock 4.1.4 options with a smaller heap.
JAVA_OPTS_FOR_JDK_17="-Dfile.encoding=UTF-8 -Djavax.security.auth.useSubjectCredsOnly=false -Xmx4096m -Xms1024m -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=$LOG_DIR -Xlog:gc*:$LOG_DIR/fe.gc.log.$CUR_DATE:time,uptime:filecount=10,filesize=50M -Darrow.enable_null_check_for_get=false --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.lang.invoke=ALL-UNNAMED --add-opens=java.base/java.lang.reflect=ALL-UNNAMED --add-opens=java.base/java.io=ALL-UNNAMED --add-opens=java.base/java.net=ALL-UNNAMED --add-opens=java.base/java.nio=org.apache.arrow.memory.core,ALL-UNNAMED --add-opens=java.base/java.util=ALL-UNNAMED --add-opens=java.base/java.util.concurrent=ALL-UNNAMED --add-opens=java.base/java.util.concurrent.atomic=ALL-UNNAMED --add-opens=java.base/sun.nio.ch=ALL-UNNAMED --add-opens=java.base/sun.nio.cs=ALL-UNNAMED --add-opens=java.base/sun.security.action=ALL-UNNAMED --add-opens=java.base/sun.util.calendar=ALL-UNNAMED --add-opens=java.security.jgss/sun.security.krb5=ALL-UNNAMED --add-opens=java.management/sun.management=ALL-UNNAMED --add-opens=java.base/jdk.internal.ref=ALL-UNNAMED --add-opens=java.xml/com.sun.org.apache.xerces.internal.jaxp=ALL-UNNAMED"

# Stock Doris ports; the backend defaults (9050/9060/8040/8060) are the stock BE ports too.
http_port = 8030
rpc_port = 9020
query_port = 9030
edit_log_port = 9010
arrow_flight_sql_port = -1

sys_log_level = INFO
sys_log_mode = ASYNC

# Keep the FE on loopback so it advertises 127.0.0.1 to the backend (matches --fe-host).
priority_networks = 127.0.0.0/8

# The backend reads parquet through the local() table-valued function.
enable_outfile_to_local = true
enable_access_file_without_broker = true

# Fragments are shipped TCompact-encoded (the backend decodes both, this is the default).
use_compact_thrift_rpc = true
