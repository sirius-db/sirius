[package]
name = "sirius-ffi"
version.workspace = true
edition.workspace = true
description = "Existing Sirius C++ FFI bindings for execution and object stores."
license = "Apache-2.0"
publish = false

[features]
static = ["sirius-sys/static"]

[dependencies]
sirius-sys.workspace = true
cxx.workspace = true
arrow-array = { version = "60.1", features = ["ffi"] }
arrow-schema = "60"

[build-dependencies]
cxx-build.workspace = true

[dev-dependencies]
substrait = "0.65"
prost = "0.14"
parquet = "60"
tempfile = "3"
