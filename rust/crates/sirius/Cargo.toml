[package]
name = "sirius"
version.workspace = true
edition.workspace = true
description = "Safe, idiomatic Rust bindings for Sirius, the GPU-native SQL engine."
license = "Apache-2.0"
# Transitively links a local Sirius build-tree artifact; not for crates.io.
publish = false

[features]
# Forwarded to sirius-sys: link the self-contained libsirius.a (no runtime deps)
# instead of the default libsirius.so. See sirius-sys for details.
static = ["sirius-sys/static"]

[dependencies]
cxx.workspace = true
sirius-sys.workspace = true
# Results are returned over the Arrow C Data Interface; pin to the same major as
# the StarRocks CN consumer so the `ArrowArrayStreamReader` type unifies. The
# `ffi` feature provides `ffi_stream` (FFI_ArrowArrayStream / reader).
arrow-array = { version = "59", features = ["ffi"] }
arrow-schema = "59"

[dev-dependencies]
# Building a `local_files` Substrait plan + a parquet fixture for the execute test.
substrait = "0.65"
prost = "0.14"
parquet = "59"
tempfile = "3"
