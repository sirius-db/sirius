[package]
name = "instrumentation-model"
version.workspace = true
edition.workspace = true

[features]
collector = ["quent-model/collector"]

[dependencies]
quent-attributes = { workspace = true }
quent-model = { workspace = true }
quent-query-engine-model = { workspace = true }
quent-stdlib = { workspace = true }
uuid = "1"

[build-dependencies]
# Captures this crate's git provenance into QUENT_SOURCE_* so the model! macro's
# generated ModelSource records Sirius (not quent) as the model's source.
quent-build-info = { workspace = true }
