[package]
name = "instrumentation-model"
version.workspace = true
edition.workspace = true

[features]
collector = ["quent-instrumentation/io-collector"]

[dependencies]
quent-instrumentation = { git = "https://github.com/dhruv9vats/quent.git", rev = "7d0aabd70478c0d1ccc17bf95bfae6f777ef5591", features = [
    "io-msgpack",
    "io-ndjson",
    "io-postcard",
] }
serde = { version = "1", features = ["derive"] }

[build-dependencies]
quent-instrumentation-build = { git = "https://github.com/dhruv9vats/quent.git", rev = "7d0aabd70478c0d1ccc17bf95bfae6f777ef5591" }
quent-yaml = { git = "https://github.com/dhruv9vats/quent.git", rev = "7d0aabd70478c0d1ccc17bf95bfae6f777ef5591" }
# Captures this crate's git provenance into QUENT_SOURCE_* so the generated ModelSource
# records Sirius (not quent) as the model's source in the model.qmi sidecar.
quent-build-info = { git = "https://github.com/dhruv9vats/quent.git", rev = "7d0aabd70478c0d1ccc17bf95bfae6f777ef5591" }
