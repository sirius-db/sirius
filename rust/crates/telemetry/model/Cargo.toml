[package]
name = "instrumentation-model"
version.workspace = true
edition.workspace = true

[features]
collector = ["quent-instrumentation/io-collector"]

[dependencies]
quent-instrumentation = { workspace = true, features = ["io-ndjson"] }
serde = { version = "1", features = ["derive"] }

[build-dependencies]
quent-instrumentation-build = { workspace = true }
quent-yaml = { workspace = true }
# Captures this crate's git provenance into QUENT_SOURCE_* so the generated ModelSource
# records Sirius (not quent) as the model's source in the model.qmi sidecar.
quent-build-info = { workspace = true }
