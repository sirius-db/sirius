[package]
name = "instrumentation-model"
version.workspace = true
edition.workspace = true

[features]
collector = ["quent-instrumentation/io-collector"]

[dependencies]
quent-instrumentation = { git = "https://github.com/rapidsai/quent.git", rev = "bcfe076a8fcb05b8a1fae4efb9e1e2bfee9cca2b", features = [
    "io-msgpack",
    "io-ndjson",
    "io-postcard",
] }
serde = { version = "1", features = ["derive"] }

[build-dependencies]
quent-instrumentation-build = { git = "https://github.com/rapidsai/quent.git", rev = "bcfe076a8fcb05b8a1fae4efb9e1e2bfee9cca2b" }
quent-yaml = { git = "https://github.com/rapidsai/quent.git", rev = "bcfe076a8fcb05b8a1fae4efb9e1e2bfee9cca2b" }
# Captures this crate's git provenance into QUENT_SOURCE_* so the generated ModelSource
# records Sirius (not quent) as the model's source in the model.qmi sidecar.
quent-build-info = { git = "https://github.com/rapidsai/quent.git", rev = "bcfe076a8fcb05b8a1fae4efb9e1e2bfee9cca2b" }
