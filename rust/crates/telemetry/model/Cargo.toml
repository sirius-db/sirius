[package]
name = "instrumentation-model"
version.workspace = true
edition.workspace = true

[features]
collector = ["quent-model/collector"]

[dependencies]
# TEMP pin: the quent-open feature stack, hosted on the mbrobbel/quent fork
# until it lands on quent main (revert to a rapidsai/quent main rev then).
quent-attributes = { git = "https://github.com/mbrobbel/quent.git", rev = "27052c857918885b1b79fa07df59928a0290d87f" }
quent-model = { git = "https://github.com/mbrobbel/quent.git", rev = "27052c857918885b1b79fa07df59928a0290d87f" }
quent-query-engine-model = { git = "https://github.com/mbrobbel/quent.git", rev = "27052c857918885b1b79fa07df59928a0290d87f" }
quent-stdlib = { git = "https://github.com/mbrobbel/quent.git", rev = "27052c857918885b1b79fa07df59928a0290d87f" }
uuid = "1"

[build-dependencies]
# Captures this crate's git provenance into QUENT_SOURCE_* so the model! macro's
# generated ModelSource records Sirius (not quent) as the model's source.
quent-build-info = { git = "https://github.com/mbrobbel/quent.git", rev = "27052c857918885b1b79fa07df59928a0290d87f" }
