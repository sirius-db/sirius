[package]
name = "telemetry-bridge"
version.workspace = true
edition.workspace = true

[lib]
name = "telemetry_bridge"
crate-type = ["staticlib"]

[dependencies]
cxx = "1"
instrumentation-model = { path = "../model" }
quent-dynamic-attributes = { git = "https://github.com/rapidsai/quent.git", rev = "bcfe076a8fcb05b8a1fae4efb9e1e2bfee9cca2b" }
quent-instrumentation = { git = "https://github.com/rapidsai/quent.git", rev = "bcfe076a8fcb05b8a1fae4efb9e1e2bfee9cca2b", features = ["io-ndjson", "io-msgpack", "io-postcard"] }
quent-io = { git = "https://github.com/rapidsai/quent.git", rev = "bcfe076a8fcb05b8a1fae4efb9e1e2bfee9cca2b", default-features = false, features = ["ndjson", "msgpack", "postcard"] }
nvtx-injection = { git = "https://github.com/rapidsai/quent.git", rev = "bcfe076a8fcb05b8a1fae4efb9e1e2bfee9cca2b", features = ["static-injection"] }
quent-nvtx-bridge = { git = "https://github.com/rapidsai/quent.git", rev = "bcfe076a8fcb05b8a1fae4efb9e1e2bfee9cca2b" }
quent-nvtx-events = { git = "https://github.com/rapidsai/quent.git", rev = "bcfe076a8fcb05b8a1fae4efb9e1e2bfee9cca2b" }

[build-dependencies]
cxx-build = "1"
# Experimental and unstable: quent's `experimental/vibe/codegen/cpp` (LLM-written, unreviewed
# upstream, `publish = false`). Its generated C++ API can change on any rev bump; there is no
# stable C++ generator yet.
quent-schema-codegen-cpp = { git = "https://github.com/rapidsai/quent.git", rev = "bcfe076a8fcb05b8a1fae4efb9e1e2bfee9cca2b" }
quent-yaml = { git = "https://github.com/rapidsai/quent.git", rev = "bcfe076a8fcb05b8a1fae4efb9e1e2bfee9cca2b" }
