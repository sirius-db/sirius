[package]
name = "telemetry-bridge"
version.workspace = true
edition.workspace = true

[lib]
name = "telemetry_bridge"
crate-type = ["staticlib"]

[dependencies]
cxx = "1"
instrumentation-model = { path = "../model" }
quent-dynamic-attributes = { git = "https://github.com/rapidsai/quent.git", rev = "75821b00cfc9f74a65e536e96a5c28575c1566df" }
quent-instrumentation = { git = "https://github.com/rapidsai/quent.git", rev = "75821b00cfc9f74a65e536e96a5c28575c1566df", features = ["io-ndjson", "io-msgpack", "io-postcard"] }
quent-io = { git = "https://github.com/rapidsai/quent.git", rev = "75821b00cfc9f74a65e536e96a5c28575c1566df", default-features = false, features = ["ndjson", "msgpack", "postcard"] }
nvtx-bridge = { git = "https://github.com/rapidsai/quent.git", rev = "75821b00cfc9f74a65e536e96a5c28575c1566df" }
nvtx-injection = { git = "https://github.com/rapidsai/quent.git", rev = "75821b00cfc9f74a65e536e96a5c28575c1566df", features = ["static-injection"] }

[build-dependencies]
cxx-build = "1"
instrumentation-model = { path = "../model" }
quent-schema-codegen-cpp = { git = "https://github.com/rapidsai/quent.git", rev = "75821b00cfc9f74a65e536e96a5c28575c1566df" }
quent-yaml = { git = "https://github.com/rapidsai/quent.git", rev = "75821b00cfc9f74a65e536e96a5c28575c1566df" }
