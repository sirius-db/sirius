[package]
name = "telemetry-bridge"
version.workspace = true
edition.workspace = true

[lib]
name = "telemetry_bridge"
crate-type = ["staticlib"]

[dependencies]
cxx = "1"
instrumentation-model = { path = "../model" }
quent-dynamic-attributes = { workspace = true }
quent-instrumentation = { workspace = true, features = ["io-ndjson"] }
quent-io = { workspace = true, features = ["ndjson"] }
nvtx-injection = { workspace = true, features = ["static-injection"] }
quent-nvtx-bridge = { workspace = true }
quent-nvtx-events = { workspace = true }

[build-dependencies]
cxx-build = "1"
# Experimental and unstable: quent's `experimental/vibe/codegen/cpp` (LLM-written, unreviewed
# upstream, `publish = false`). Its generated C++ API can change on any rev bump; there is no
# stable C++ generator yet.
quent-schema-codegen-cpp = { workspace = true }
quent-yaml = { workspace = true }
