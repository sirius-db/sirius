[package]
name = "sirius-telemetry-analyzer"
version.workspace = true
edition.workspace = true

[dependencies]
sirius-telemetry-store = { path = "../store" }
quent-analyzer = { git = "https://github.com/rapidsai/quent.git", rev = "396add06a1b1976ecb97a9ac4ff93462cad8e0fb" }
quent-dynamic-attributes = { git = "https://github.com/rapidsai/quent.git", rev = "396add06a1b1976ecb97a9ac4ff93462cad8e0fb" }
quent-events = { git = "https://github.com/rapidsai/quent.git", rev = "396add06a1b1976ecb97a9ac4ff93462cad8e0fb" }
quent-io = { git = "https://github.com/rapidsai/quent.git", rev = "396add06a1b1976ecb97a9ac4ff93462cad8e0fb", default-features = false, features = ["ndjson"] }
quent-query-engine-analyzer = { git = "https://github.com/rapidsai/quent.git", rev = "396add06a1b1976ecb97a9ac4ff93462cad8e0fb" }
quent-query-engine-ui = { git = "https://github.com/rapidsai/quent.git", rev = "396add06a1b1976ecb97a9ac4ff93462cad8e0fb" }
quent-store = { git = "https://github.com/rapidsai/quent.git", rev = "396add06a1b1976ecb97a9ac4ff93462cad8e0fb", default-features = false, features = ["io-ndjson"] }
quent-time = { git = "https://github.com/rapidsai/quent.git", rev = "396add06a1b1976ecb97a9ac4ff93462cad8e0fb" }
quent-ui = { git = "https://github.com/rapidsai/quent.git", rev = "396add06a1b1976ecb97a9ac4ff93462cad8e0fb" }
rustc-hash = "2"
tracing = "0.1"
uuid = { version = "1", features = ["serde"] }

[dev-dependencies]
sirius-telemetry-instrumentation = { package = "instrumentation-model", path = "../model" }
tempfile = "3"
