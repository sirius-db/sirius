[package]
name = "sirius-telemetry-analyzer"
version.workspace = true
edition.workspace = true

[dependencies]
sirius-telemetry-store = { path = "../store" }
quent-analyzer = { workspace = true }
quent-dynamic-attributes = { workspace = true }
quent-events = { workspace = true }
quent-io = { workspace = true, features = ["ndjson"] }
quent-query-engine-analyzer = { workspace = true }
quent-query-engine-ui = { workspace = true }
quent-store = { workspace = true, features = ["io-ndjson"] }
quent-time = { workspace = true }
quent-ui = { workspace = true }
rustc-hash = "2"
tracing = "0.1"
uuid = { version = "1", features = ["serde"] }

[dev-dependencies]
sirius-telemetry-instrumentation = { package = "instrumentation-model", path = "../model" }
tempfile = "3"
