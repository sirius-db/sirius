[package]
name = "sirius-telemetry-server"
version.workspace = true
edition.workspace = true

[features]
ui = ["quent-query-engine-server/ui"]
swagger = ["quent-query-engine-server/swagger"]

[dependencies]
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
sirius-telemetry-instrumentation = { package = "instrumentation-model", path = "../model", features = ["collector"] }
sirius-telemetry-analyzer = { path = "../analyzer" }
sirius-telemetry-store = { path = "../store" }
nvtx-server = { workspace = true }
quent-analyzer = { workspace = true }
quent-io = { workspace = true, features = ["ndjson"] }
quent-query-engine-analyzer = { workspace = true }
quent-query-engine-server = { workspace = true }
quent-store = { workspace = true, features = ["io-ndjson"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros"] }
tracing = "0.1"

[build-dependencies]
quent-query-engine-ui = { workspace = true }
quent-ui = { workspace = true }
ts-rs = { version = "12", features = ["uuid-impl", "serde-json-impl"] }
