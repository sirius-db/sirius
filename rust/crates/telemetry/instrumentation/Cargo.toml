[package]
name = "sirius-telemetry-instrumentation"
version.workspace = true
edition.workspace = true

[features]
collector = ["quent-instrumentation/io-collector"]

[dependencies]
quent-events = { git = "https://github.com/rapidsai/quent.git", rev = "fdf836950eab4df71189780b60ed1a5f34013c23", features = ["serde"] }
quent-instrumentation = { git = "https://github.com/rapidsai/quent.git", rev = "fdf836950eab4df71189780b60ed1a5f34013c23", features = ["io-msgpack", "io-ndjson", "io-postcard"] }
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["serde", "v7"] }

[build-dependencies]
quent-build-info = { git = "https://github.com/rapidsai/quent.git", rev = "fdf836950eab4df71189780b60ed1a5f34013c23" }
quent-instrumentation-build = { git = "https://github.com/rapidsai/quent.git", rev = "fdf836950eab4df71189780b60ed1a5f34013c23" }
quent-yaml = { git = "https://github.com/rapidsai/quent.git", rev = "fdf836950eab4df71189780b60ed1a5f34013c23" }
