[workspace]
resolver = "3"
members = [
    "crates/telemetry/bridge",
    "crates/telemetry/model",
    "crates/telemetry/analyzer",
    "crates/telemetry/server",
    "crates/telemetry/model",
    "crates/sirius-sys",
    "crates/sirius"
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
# cxx and cxx-build must resolve to the same version (the generated bridge is
# version-coupled). The shared "1" caret + the lockfile keep them in lockstep.
cxx = "1"
cxx-build = "1"
sirius-sys = { path = "crates/sirius-sys" }

# TEMPORARY (batch data-flow telemetry development): override the pinned quent
# git revs with a local quent worktree carrying the new distribution-timeline
# protocol. Remove once quent lands on main and the revs are bumped.
[patch."https://github.com/rapidsai/quent.git"]
quent-analyzer = { path = "/home/felipe/projects/quent/.claude/worktrees/dag-data-flow-timeline-d6f6e4/crates/analyzer" }
quent-attributes = { path = "/home/felipe/projects/quent/.claude/worktrees/dag-data-flow-timeline-d6f6e4/crates/attributes" }
quent-build-info = { path = "/home/felipe/projects/quent/.claude/worktrees/dag-data-flow-timeline-d6f6e4/crates/build-info" }
