[workspace]
resolver = "3"
members = [
    "crates/telemetry/bridge",
    "crates/telemetry/model",
    "crates/telemetry/analyzer",
    "crates/telemetry/server",
    "crates/telemetry/model",
    "crates/sirius-sys",
    "crates/sirius"
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
# cxx and cxx-build must resolve to the same version (the generated bridge is
# version-coupled). The shared "1" caret + the lockfile keep them in lockstep.
cxx = "1"
cxx-build = "1"
sirius-sys = { path = "crates/sirius-sys" }

# TODO: repin to a rapidsai/quent main rev once the quent-open stack lands.
quent-analyzer = { git = "https://github.com/mbrobbel/quent.git", rev = "bf638347a78607647eac9295976233144bcd14a5" }
quent-attributes = { git = "https://github.com/mbrobbel/quent.git", rev = "bf638347a78607647eac9295976233144bcd14a5" }
quent-build-info = { git = "https://github.com/mbrobbel/quent.git", rev = "bf638347a78607647eac9295976233144bcd14a5" }
